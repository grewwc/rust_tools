plugins {
    id "com.android.application"
}

def configuredServeUrl = providers.gradleProperty("serveUrl")
        .getOrElse("https://10.37.110.250:8080")
def escapedServeUrl = configuredServeUrl
        .replace("\\", "\\\\")
        .replace("\"", "\\\"")

android {
    namespace "com.grewwc.aserve"
    compileSdk 33

    defaultConfig {
        applicationId "com.grewwc.aserve"
        minSdk 26
        targetSdk 33
        versionCode 19
        versionName "1.15.1"
        buildConfigField "String", "DEFAULT_SERVER_URL", "\"${escapedServeUrl}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}