<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>a serve</title>
<style>
:root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --line:#30363d; --fg:#e6edf3; --dim:#8b949e; --acc:#2f81f7; --ok:#3fb950; --err:#f85149; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; display:flex; flex-direction:column; height:100dvh; }
header { display:flex; align-items:center; gap:8px; padding:10px 12px; background:var(--panel); border-bottom:1px solid var(--line); }
header b { font-size:15px; }
#info { font-size:12px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
button, select, input, textarea { font:inherit; color:var(--fg); background:#0d1117; border:1px solid var(--line); border-radius:8px; }
button { padding:7px 12px; background:#21262d; cursor:pointer; touch-action:manipulation; }
button:disabled { opacity:.5; cursor:default; }
button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
/* While a turn runs the same button becomes the stop button; the stop state
   reuses --err the way .primary reuses --acc, and leaves the idle look alone. */
button.stop { background:var(--err); border-color:var(--err); color:#fff; }
#views { flex:1; display:flex; min-height:0; position:relative; }
#sessions { width:min(78vw,300px); border-right:1px solid var(--line); background:var(--panel); display:none; flex-direction:column; }
#sessions.open { display:flex; }
#sessions ul { list-style:none; margin:0; padding:8px; overflow-y:auto; flex:1; }
#sessions li { padding:8px; border-radius:8px; font-size:14px; }
#sessions li.cur { background:#1f6feb33; }
#sessions li small { color:var(--dim); display:block; font-size:12px; }
#sessions li .rn { float:right; background:none; border:none; color:var(--dim); font-size:14px; padding:4px 10px; cursor:pointer; }
#sessions li .rnm { width:100%; font-size:inherit; box-sizing:border-box; }
#sessfilter { margin:8px 8px 0; padding:6px 8px; font-size:13px; width:calc(100% - 16px); box-sizing:border-box; }
#sesscount { padding:4px 12px 0; color:var(--dim); font-size:12px; }
#scrim { display:none; }
/* Desktop renders the override row exactly as before: the wrapper is
   transparent and its summary hidden (the phone query below undoes both). */
#ovrwrap { display:contents; }
#ovrwrap > summary { display:none; }
html { -webkit-text-size-adjust:100%; }
select, summary { touch-action:manipulation; }
.msg details summary { padding:10px 4px; cursor:pointer; }
/* 16px form text stops iOS Safari auto-zooming into focused fields;
   padding keeps the visual size small. */
#ovr select, #conn input, #sessfilter { font-size:16px; }
/* The token-length line is diagnostics: show it only while the conn panel
   is open instead of spending a permanent row on it. */
#conn:not(.open) + #connstat { display:none; }
#chat { flex:1; display:flex; flex-direction:column; min-width:0; }
#msgs { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px; overscroll-behavior-y:contain; }
.msg { max-width:92%; padding:8px 12px; border-radius:12px; white-space:pre-wrap; word-break:break-word; font-size:15px; }
.msg.user { align-self:flex-end; background:#1f6feb; color:#fff; }
.msg.asst { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
.msg details { font-size:13px; color:var(--dim); }
/* Rewindable user bubbles invite a tap (mirrors `/history rewind`); the
   pointer is the only affordance so the transcript stays uncluttered. */
.msg.rewindable { cursor:pointer; }
.msg .prog { font-size:13px; color:var(--dim); }
.msg.err { border-color:var(--err); color:var(--err); }
#ovr { display:flex; gap:6px; padding:8px 12px 0; }
#ovr select { flex:1; min-width:0; font-size:13px; padding:6px 8px; }
#composer { display:flex; gap:8px; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:var(--panel); border-top:1px solid var(--line); }
#prompt { flex:1; min-height:44px; max-height:30dvh; padding:9px 10px; resize:none; }
#conn { display:none; gap:6px; padding:8px 12px; background:var(--panel); border-top:1px solid var(--line); }
#conn.open { display:flex; }
#conn input { flex:1; min-width:0; font-size:13px; padding:6px 8px; }
#connstat { display:none; padding:2px 12px 6px; font-size:12px; color:var(--dim); background:var(--panel); }
#connstat.show { display:block; }
/* Transient status notes (stop turn) must read with the conn panel closed,
   unlike the diagnostics line above, so this beats the sibling
   `#conn:not(.open) + #connstat` rule that hides it. */
#connstat.note { display:block !important; }
.rowbtns { display:flex; gap:6px; padding:6px 8px; }
.rowbtns button { font-size:12px; padding:4px 8px; }
#sessbar { display:flex; align-items:baseline; gap:8px; padding:6px 12px; background:var(--panel); border-bottom:1px solid var(--line); font-size:13px; cursor:pointer; }
#sesstitle { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
#sessmeta { color:var(--dim); font-size:12px; white-space:nowrap; }
/* Rendered markdown for assistant replies (.md): block layout instead of the
   pre-wrap source view the other bubbles keep. */
.msg.md { white-space:normal; }
.msg.md .p { margin:3px 0; }
.msg.md .h { font-weight:700; margin:6px 0 2px; }
.msg.md .h.lv1 { font-size:19px; }
.msg.md .h.lv2 { font-size:17px; }
.msg.md .h.lv3 { font-size:16px; }
.msg.md .h.lv4, .msg.md .h.lv5, .msg.md .h.lv6 { font-size:15px; }
.msg.md .li { display:flex; gap:6px; margin:3px 0; }
.msg.md .li > .bullet { flex:0 0 auto; color:var(--dim); min-width:14px; }
/* A flex item refuses to shrink below its min-content width by default, so one
   unbreakable inline code token would push the bubble past the phone viewport.
   min-width:0 lets it shrink; anywhere lets the token itself wrap. */
.msg.md .li > span:not(.bullet) { min-width:0; overflow-wrap:anywhere; }
.msg.md blockquote { margin:4px 0; padding:2px 0 2px 8px; border-left:3px solid var(--line); color:var(--dim); }
.msg.md hr { border:0; border-top:1px solid var(--line); margin:8px 0; }
.msg.md a { color:var(--acc); }
.msg.md code { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:13px;
  background:#0d1117; border:1px solid var(--line); border-radius:5px; padding:0 4px; overflow-wrap:anywhere; }
.msg.md pre { margin:6px 0; padding:8px; background:#0d1117; border:1px solid var(--line);
  border-radius:8px; overflow-x:auto; }
/* Wrap code instead of scrolling it: a phone cannot hover, and a horizontal
   scroll region hides the tail of a line behind an easy-to-miss gesture. */
.msg.md pre code { background:none; border:0; padding:0; white-space:pre-wrap; overflow-wrap:anywhere; }
.msg.md .tablewrap { overflow-x:auto; margin:6px 0; }
/* Keep wide equations scrollable inside the bubble, including flex list items. */
.msg.md .li > span:last-child { min-width:0; }
.msg.md .math { max-width:100%; overflow-x:auto; overflow-y:hidden; word-break:normal; }
.msg.md .math.display { display:block; margin:8px 0; padding:4px 0; }
.msg.md .math.inline { display:inline-block; vertical-align:middle; }
.msg.md .math .katex-display { margin:0; text-align:left; }
.msg.md .math .katex-display > .katex { text-align:left; }
.msg.md table { border-collapse:collapse; font-size:13px; }
.msg.md th, .msg.md td { border:1px solid var(--line); padding:2px 6px; text-align:left; }
/* A turn can stop and ask before doing something (a tool that needs an
   explicit yes). The question is modal on purpose: the turn stays blocked
   until it is answered, and this dialog is the only way to answer it. */
#confirmwrap { position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center; padding:16px; background:rgba(0,0,0,.55); }
#confirmwrap.open { display:flex; }
#confirmbox { width:100%; max-width:440px; max-height:80dvh; overflow-y:auto; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:10px; box-shadow:0 12px 32px rgba(0,0,0,.6); }
#confirmtitle { font-size:12px; color:var(--dim); }
#confirmtext { white-space:pre-wrap; word-break:break-word; overflow-wrap:anywhere; font-size:15px; }
#confirmerr { display:none; color:var(--err); font-size:13px; }
#confirmerr.show { display:block; }
#confirmbtns { display:flex; gap:8px; }
#confirmbtns button { flex:1; min-height:44px; }
/* ---- phone layout (narrow viewports only; desktop is untouched) ---------- */
@media (max-width:700px) {
  header button { min-width:44px; min-height:44px; }
  /* The drawer floats over the chat instead of squeezing it; tapping the
     dimmed remainder (the scrim) closes it. */
  #sessions { position:absolute; top:0; bottom:0; left:0; z-index:10; width:min(86vw,320px); box-shadow:8px 0 24px rgba(0,0,0,.55); }
  #scrim.on { display:block; position:absolute; inset:0; z-index:5; background:rgba(0,0,0,.45); }
  #sessions li { padding:12px 10px; font-size:15px; }
  .rowbtns button { flex:1; min-height:42px; font-size:13px; }
  #sessfilter { padding:10px 8px; }
  /* Override picks collapse into one summary row showing the current picks. */
  #ovrwrap { display:block; border-top:1px solid var(--line); }
  #ovrwrap > summary { display:block; padding:8px 12px; font-size:12px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #ovr { flex-direction:column; padding:8px 12px 10px; }
  #ovr select { width:100%; padding:10px 8px; }
  #msgs { padding:10px; }
  .msg { max-width:94%; }
  #composer { gap:10px; }
  #img, #send { min-width:52px; min-height:48px; font-size:18px; }
  #conn.open { flex-wrap:wrap; }
  #conn.open input { flex:1 1 100%; padding:10px 8px; }
  #conn.open #save { flex:1; min-height:44px; }
}
/* Server-side images in a reply: the path text stays, the fetched picture
   sits under it (see decorateImages in the script below). */
.imgprev { display:block; margin:6px 0; }
.imgprev.loaded { padding:6px; border:1px solid var(--line); border-radius:8px; }
.imgprev img { display:block; max-width:100%; max-height:52vh; border-radius:6px; }
.imgprev .imgcap { display:block; margin-top:4px; font-size:11px; color:var(--dim); word-break:break-all; }
#viewer { display:none; position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.92); align-items:center; justify-content:center; }
#viewer.on { display:flex; }
#viewer img { max-width:100vw; max-height:100vh; }
</style>
</head>
<body id="serve-app">
<header>
<button id="menu" aria-label="sessions">☰</button>
<b>a</b><span id="info">connecting…</span>
<button id="connbtn" aria-label="connection">⚙</button>
<button id="newbtn" class="primary">＋</button>
</header>
<div id="sessbar" title="sessions"><span id="sesstitle">no session</span><span id="sessmeta"></span></div>
<div id="conn">
<input id="base" placeholder="server, e.g. http://192.168.1.5:8080 (empty = this page)">
<input id="token" type="password" placeholder="bearer token (ai.serve.token)" style="flex:1">
<button id="save">save</button>
</div>
<div id="connstat"></div>
<div id="views">
<div id="scrim"></div>
<nav id="sessions"><input id="sessfilter" placeholder="filter sessions…" autocomplete="off">
<div id="sesscount"></div><ul id="sesslist"></ul>
<div class="rowbtns"><button id="fork">fork</button><button id="del">delete</button><button id="refresh">refresh</button></div>
</nav>
<main id="chat">
<div id="msgs"></div>
<details id="ovrwrap" open>
<summary id="ovrsummary">model · agent · effort</summary>
<div id="ovr">
<select id="omodel" aria-label="model override"></select>
<select id="oagent" aria-label="agent override"></select>
<select id="oeffort" aria-label="reasoning effort override"></select>
</div>
</details>
<div id="composer">
<button id="img" aria-label="attach image">🖼</button>
<input id="file" type="file" accept="image/*" multiple hidden>
<textarea id="prompt" placeholder="ask…" rows="1"></textarea>
<button id="send" class="primary">➤</button>
</div>
</main>
</div>
<div id="confirmwrap" role="alertdialog" aria-modal="true" aria-labelledby="confirmtitle">
<div id="confirmbox">
<div id="confirmtitle">confirmation needed</div>
<div id="confirmtext"></div>
<div id="confirmerr"></div>
<div id="confirmbtns"><button id="cdeny">Deny</button><button id="callow" class="primary">Allow</button></div>
</div>
</div>
<div id="viewer"><img id="viewerimg" alt=""></div>
<script>
"use strict";
// Minimal mobile client for the serve HTTP API (same routes as serve-chat).
// Same-origin by default: when opened via http://<host>:<port>/app the base is
// this page's origin. Token is kept in localStorage, never in the URL.
const $ = (id) => document.getElementById(id);
const store = {
  get base() { return (localStorage.getItem("serve.base") || "").trim() || location.origin; },
  get token() { return localStorage.getItem("serve.token") || ""; },
};
let sessionId = localStorage.getItem("serve.session") || "";
// Id returned by POST /sessions that the server has not persisted yet:
// sessions materialize on the first turn, so the id is absent from
// GET /sessions until then. While set, loadSessions keeps it selected
// instead of jumping to the first stored session.
let pendingNew = null;
let lastItems = []; // latest /sessions payload (newest-first), backing the session bar
let lastMsgCount = null; // message count from the last history load
// Live turns, one entry per session that is streaming right now: the page can
// hold a turn in one session, switch to another, and start a second turn there.
// Each entry owns the container its stream writes into, so concurrent streams
// never interleave into one transcript. A turn whose session is not on screen
// keeps updating its detached box, and `appendChild` on return re-attaches it
// with everything that streamed while the user was away.
let turns = new Map(); // session id -> {box}
// A browser gives one origin a handful of parallel connections and a live turn
// holds one open until its stream ends, so the cap keeps session polling and
// image fetches from starving behind streaming turns.
const MAX_LIVE_TURNS = 4;
// Guards one send's own setup (creating the session, waiting for its POST to be
// accepted); the per-session entry takes over from there, so a turn in another
// session never waits behind this one.
let sendBusy = false;
let runEpoch = 0; // bumped every time this page starts a stream: a poll sent
// under an older epoch must not revive `turnRunning` after a newer turn.
// True while the server reports a live turn for the shown session (GET
// /confirm). Cleared when a stream starts or ends here, on session switch, or
// when an interrupt POST returns; the next poll is the truth again. The sample
// expires (RUNNING_SAMPLE_TTL_MS): stale ticks refresh it every 4s and event
// polls refresh it on return, so only a dead sample can go stale — and a dead
// sample must not hold the stop button forever.
let turnRunning = false;
let turnRunningAt = 0; // Date.now() of the last poll that reported running
const RUNNING_SAMPLE_TTL_MS = 60000; // a running sample older than this is stale
let stopBusy = false; // one interrupt POST at a time: a double tap must not send two
let noteTimer = null; // pending auto-clear of the transient #connstat note
let pendingImages = []; // {filename, data_base64}
// A turn stream that dies on the wire (page backgrounded, network switched) is
// not a failed turn: the turn child keeps running server-side and only this
// page loses the live feed. Such a view is stale, not broken — see
// startStaleFollow, which reloads it from history.
let staleSession = ""; // session whose live feed was lost; "" when none
let staleKey = ""; // fingerprint of the newest history row already rendered
let staleDone = false; // newest history row is a real assistant reply
let staleTimer = null; // follow-up reload timer while the reply is pending
let staleTries = 0; // bounded follow-ups: an idle page must not ask forever
let staleBusy = false; // one history fetch at a time; ticks may overlap a slow one
const STALE_FOLLOW_MS = 4000; // follow-up reload interval
const STALE_FOLLOW_TRIES = 300; // ~20 min of visible following, then ↻ takes over

// A turn can stop and ask for confirmation, and the question is answered over
// HTTP rather than the stream, so it outlives the feed that delivered it: the
// same dialog is driven by the SSE `confirm_request` event and by pollConfirm.
let confirmShown = null; // {id, prompt} currently on screen; null when hidden
let confirmBusy = false; // one answer POST at a time: a double tap must not send two

function headers(json) {
  const h = {};
  if (json) h["Content-Type"] = "application/json";
  if (store.token) h["Authorization"] = "Bearer " + store.token;
  return h;
}
async function api(path, opts) {
  // Attach auth on every call: individual call sites must not have to
  // remember the header (missing it once means a bare 401 with no token
  // reaching the server, which looks identical to "wrong token").
  opts = opts || {};
  opts.headers = Object.assign(headers(!!opts.body), opts.headers || {});
  const res = await fetch(store.base + path, opts);
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).error || detail; } catch (_) {}
    throw new Error(res.status + " " + detail);
  }
  return res;
}
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// --- markdown -------------------------------------------------------------
// Replies arrive as markdown source; the terminal client renders the same text
// through MarkdownStreamRenderer, so a phone showing the raw source looked
// broken next to it (literal `**`, backticks and "- " bullets). Every rule
// below escapes before it emits markup, so reply text can never inject tags,
// and a construct that is not covered here stays visible as plain text rather
// than being dropped.
const mdText = (s) => s
  .replace(/\*\*([^*\n]+?)\*\*/g, "<b>$1</b>")
  .replace(/~~([^~\n]+?)~~/g, "<s>$1</s>")
  .replace(/\*([^\s*][^*\n]*?)\*/g, "<i>$1</i>")
  // Parens inside a link destination are balanced, so a URL like wiki/Foo_(bar)
  // does not end the link at the first ")".
  .replace(/\[([^\]\n]+?)\]\((https?:\/\/(?:[^()\s]|\([^()\s]*\))+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
  .replace(/&lt;(https?:\/\/[^\s&]+)&gt;/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
// Code spans are literal, so they are cut out before the inline rules run.
const mdInline = (src) => {
  let html = "", last = 0, m;
  const re = /`([^`]+)`/g;
  while ((m = re.exec(src))) {
    html += mdText(src.slice(last, m.index)) + "<code>" + m[1] + "</code>";
    last = m.index + m[0].length;
  }
  return html + mdText(src.slice(last));
};
// Protect TeX before Markdown can interpret its stars, pipes, or newlines.
// Slots are collision-free and restored only in text, never in code or URLs.
function protectMath(src) {
  // A space prevents a slot from turning an invalid URL into a Markdown link.
  let key = "\uE000math ";
  while (src.includes(key)) key += "X";
  const slots = [], chunks = [];
  let i = 0, last = 0;
  while (i < src.length) {
    const rest = src.slice(i);
    if (i === 0 || src[i - 1] === "\n") {
      const fence = /^[ \t]*(`{3,}|~{3,})[ \t]*([^\s`]*)[ \t]*(?:\n|$)/.exec(rest);
      if (fence) {
        const tail = src.slice(i + fence[0].length);
        const close = new RegExp("^[ \\t]*" + fence[1][0] + "{3,}[ \\t]*(?:\\n|$)", "m").exec(tail);
        i = close ? i + fence[0].length + close.index + close[0].length : src.length;
        continue;
      }
    }
    const code = /^(`+)(?!`)[\s\S]*?\1(?!`)/.exec(rest);
    const link = /^(?:\[[^\]\n]+?\]\((?:https?:\/\/(?:[^()\s]|\([^()\s]*\))+)\)|<https?:\/\/[^\s<>]+>)/.exec(rest);
    if (code || link) { i += (code || link)[0].length; continue; }
    // An unfinished code span remains literal while the reply is streaming.
    if (src[i] === "`") { const end = src.indexOf("\n", i); i = end < 0 ? src.length : end; continue; }
    const left = rest.startsWith("$$") ? "$$" : rest.startsWith("\\[") ? "\\[" :
      rest.startsWith("\\(") ? "\\(" : src[i] === "$" ? "$" : "";
    if (!left) { i += src[i] === "\\" ? 2 : 1; continue; }
    const right = left === "\\[" ? "\\]" : left === "\\(" ? "\\)" : left;
    const display = left === "$$" || left === "\\[";
    const start = i + left.length;
    let end = -1, depth = 0;
    if (left !== "$" || (start < src.length && !/\s/.test(src[start]))) {
      for (let j = start; j < src.length; j++) {
        if (!display && src[j] === "\n") break;
        if (depth === 0 && src.startsWith(right, j)) {
          // Avoid pairing currency amounts such as "$5 and $10".
          if (left !== "$" || (j > start && !/\s/.test(src[j - 1]) && !/\d/.test(src[j + 1] || ""))) end = j;
          break;
        }
        if (src[j] === "\\") { j++; continue; }
        if (src[j] === "{") depth++;
        else if (src[j] === "}") depth = Math.max(0, depth - 1);
      }
    }
    if (end < 0 || !src.slice(start, end).trim()) { i += left.length; continue; }
    const raw = src.slice(i, end + right.length), tex = src.slice(start, end);
    chunks.push(src.slice(last, i), key + slots.length + "\uE001");
    slots.push('<span class="math ' + (display ? "display" : "inline") + '" data-tex="' + esc(tex) + '">' + esc(raw) + '</span>');
    last = i = end + right.length;
  }
  chunks.push(src.slice(last));
  return { source: chunks.join(""), restore: (html) => html.replace(new RegExp(key + "(\\d+)\uE001", "g"), (_, n) => slots[Number(n)]) };
}

// Load only for mathematical replies. A failed/slow CDN leaves readable source
// and must not block the chat, retry on every stream paint, or retain old roots.
let mathLoading = null, mathReady = false;
function decorateMath(root) {
  if (!root.querySelector(".math[data-tex]")) return;
  if (mathReady) { typesetMath(root); return; }
  if (mathLoading) return;
  const base = "https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/";
  const load = (tag, file, integrity) => new Promise((resolve, reject) => {
    const el = document.createElement(tag);
    el.crossOrigin = "anonymous";
    el.integrity = integrity;
    el.referrerPolicy = "no-referrer";
    el.onload = resolve;
    el.onerror = reject;
    if (tag === "link") { el.rel = "stylesheet"; el.href = base + file; }
    else { el.async = true; el.src = base + file; }
    document.head.appendChild(el);
  });
  mathLoading = Promise.all([
    load("link", "katex.min.css", "sha384-3rdsX6e5mueWyoweR9NIVmtEsUkokpBT/0ALqKKIBMr9j4qhHkaIkAcGgsE6uVlp"),

// Whole-reply renderer: blocks are recognised on the raw lines (a quote marker
// is still ">" here, not "&gt;") and each block's text is escaped on the way
// out. Blank lines inside one paragraph run become the <br> gaps between them.
function renderMarkdown(src) {
  const math = protectMath(String(src).replace(/\r\n?/g, "\n"));
  const lines = math.source.split("\n");
  const inline = (s) => math.restore(mdInline(esc(s)));
  const out = [];
  let text = [];
  const flushText = () => {
    while (text.length && !text[0]) text.shift();
    while (text.length && !text[text.length - 1]) text.pop();
    if (text.length) out.push('<div class="p">' + text.map(inline).join("<br>") + "</div>");
    text = [];
  };
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    const fence = /^\s*(`{3,}|~{3,})\s*([^\s`]*)\s*$/.exec(line);
    if (fence) {
      const closer = new RegExp("^\\s*" + fence[1][0] + "{3,}\\s*$");
      const body = [];
      for (i++; i < lines.length && !closer.test(lines[i]); i++) body.push(lines[i]);
      i++; // skip the closing fence: a stream cut mid-block has none yet
      flushText();
      out.push("<pre" + (fence[2] ? ' data-lang="' + esc(fence[2]) + '"' : "") +
        "><code>" + esc(body.join("\n")) + "</code></pre>");
      continue;
    }
    const head = /^\s{0,3}(#{1,6})\s+(.+?)\s*#*\s*$/.exec(line);
    if (head) {
      flushText();
      out.push('<div class="h lv' + head[1].length + '">' + inline(head[2]) + "</div>");
      i++;
      continue;
    }
    if (/^\s{0,3}(?:-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
      flushText();
      out.push("<hr>");
      i++;
      continue;
    }
    if (/^\s{0,3}>/.test(line)) {
      flushText();
      const quoted = [];
      for (; i < lines.length && /^\s{0,3}>/.test(lines[i]); i++) quoted.push(lines[i].replace(/^\s{0,3}>\s?/, ""));
      out.push("<blockquote>" + quoted.map(inline).join("<br>") + "</blockquote>");
      continue;
    }
    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      flushText();
      const cells = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      const ths = cells(line);
      i += 2; // the delimiter row is markup, not content
      const rows = [];
      for (; i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i]); i++) rows.push(cells(lines[i]));
      out.push('<div class="tablewrap"><table><thead><tr>' +
        ths.map((c) => "<th>" + inline(c) + "</th>").join("") + "</tr></thead><tbody>" +
        rows.map((r) => "<tr>" + r.map((c) => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("") +
        "</tbody></table></div>");
      continue;
    }
    const item = /^([ \t]*)([-*+]|\d{1,3}[.)])\s+(.*)$/.exec(line);
    if (item) {
      flushText();
      const indent = item[1].replace(/\t/g, "  ").length;
      const body = [inline(item[3])];
      // A deeper-indented plain line continues this bullet; anything else ends
      // it, so the next line starts its own block.
      for (i++; i < lines.length; i++) {
        const cont = /^([ \t]+)(\S.*)$/.exec(lines[i]);
        if (!cont || cont[1].replace(/\t/g, "  ").length <= indent) break;
        // A deeper-indented list marker starts a nested bullet: stop consuming,
        // so the main loop renders it as its own item instead of a literal "-"
        // glued to the end of this one.
        if (/^([-*+]|\d{1,3}[.)])(\s|$)/.test(cont[2])) break;
        body.push(inline(cont[2]));
      }
      // Cap the indent: replies routinely nest 6+ spaces deep, which on a phone
      // (92% of ~360px) would leave almost no room for the text itself.
      const pad = Math.min(indent, 6) * 8;
      out.push('<div class="li" style="padding-left:' + pad + 'px"><span class="bullet">' +
        (/^\d/.test(item[2]) ? esc(item[2]) : "•") + '</span><span>' + body.join("<br>") + "</span></div>");
      continue;
    }
    text.push(line);
    i++;
  }
  flushText();
  return out.join("");
}

// --- server-side images ---------------------------------------------------
// A reply that names an image file (the assistant writes e.g. `out/chart.svg`)
// is only visible on a phone if the bytes come back over HTTP: the preview
// route is authed and an <img src> cannot carry the bearer token, so the page
// fetches the file itself and hands the blob to the <img>. A token that is not
// a servable image (missing, outside the roots, wrong kind) stays plain text.
let previewUrls = [];
const IMG_TOKEN_G = /[\w.@~+\/-]*[\w@~+\/-]\.(?:png|jpe?g|gif|webp|svg|avif|bmp)\b/gi;
const MAX_PREVIEWS_PER_MSG = 4;

// directory prefixes (`out/chart.svg`, `rust_tools/chart.svg`, bare
// `chart.svg`) and ends in an image extension; `xchart.svg` and `chart.svgz`
// do not. A leading `/` is deliberately excluded, so `/tmp/chart.svg` stays
// plain text: the route serves workspace-relative paths only, and a path that
// 404s is then retried once as its basename (loadPreviews), which needs the
// prefixed token to survive intact without a root ambiguity.
function imageTokensIn(text) {
  const found = [];
  IMG_TOKEN_G.lastIndex = 0;
  let m;
  while ((m = IMG_TOKEN_G.exec(text))) {
    const token = m[0];
    if (token.length > 200) continue;
    if (token.startsWith("/")) continue; // absolute paths: never workspace-relative
    const before = m.index ? text[m.index - 1] : "";
    const after = text[m.index + token.length] || "";
    if (before && !/[\s`'"(\[（【:]/.test(before)) continue;
    if (after && !/[\s`'")，。、\]】）:]/.test(after)) continue;
    found.push({ at: m.index, token: token });
  }

}
function decorateImages(root) {

  for (const node of nodes) {
    if (node.parentElement.closest(".math")) continue;
    const text = node.nodeValue || "";
    if (!budget || text.indexOf(".") === -1) continue;
    const hits = imageTokensIn(text).filter(() => budget-- > 0);
    if (!hits.length) continue;
    const frag = document.createDocumentFragment();
    let last = 0;
    for (const hit of hits) {
      frag.appendChild(document.createTextNode(text.slice(last, hit.at)));
      const slot = document.createElement("span");
      slot.className = "imgprev";
      slot.dataset.path = hit.token;
      frag.appendChild(slot);
      last = hit.at + hit.token.length;
    }
    frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag, node);

}
async function loadPreviews(root) {

  for (const slot of root.querySelectorAll("span.imgprev:not([data-held])")) {

    const path = slot.dataset.path;
    // Assistants print both workspace-relative paths and bare names, and the
    // printed prefix need not match the served root; a path that fails is
    // retried once as a basename before the token falls back to plain text.
    const attempt = async (p) => {
      const res = await api("/sessions/" + sessionId + "/file?path=" + encodeURIComponent(p));
      if (!res.ok) throw new Error("HTTP " + res.status);
      return URL.createObjectURL(await res.blob());
    };
    try {
      let url;
      try {
        url = await attempt(path);
      } catch (e) {
        const cut = path.lastIndexOf("/");
        if (cut <= 0) throw e;
        url = await attempt(path.slice(cut + 1));
      }
      previewUrls.push(url);
      const img = document.createElement("img");
      img.src = url;
      img.alt = path;
      img.loading = "lazy";
      img.onclick = () => showViewer(url);
      const cap = document.createElement("span");
      cap.className = "imgcap";
      cap.textContent = path;
      slot.append(img, cap);

    } catch (e) {
      slot.replaceWith(document.createTextNode(path));

}

function revokePreviews() {
  for (const url of previewUrls) URL.revokeObjectURL(url);

}

// The three override picks are per-session, not per-browser: they live in the
// session's own config on the server (`GET`/`POST /sessions/{id}/config`), so
// changing the model in one session never leaks into another, and reopening a
// session — even after the browser was closed — restores its picks from the
// server. The empty value always means "server default".
const PICK_KEYS = { omodel: "model", oagent: "agent", oeffort: "reasoning_effort" };
// Mirror the current session's stored picks into the three selects. Runs after
// the dropdown options exist (loadInfo) and whenever the current session
// changes; a fetch that lost the session switch is dropped instead of painting
// another session's picks onto this one.
async function loadSessionConfig() {
  const sid = sessionId;
  if (!sid) { resetPicks(); return; }
  try {
    const cfg = await (await api("/sessions/" + sid + "/config")).json();
    if (sid !== sessionId) return; // the user switched sessions meanwhile
    applySessionConfig(cfg);
  } catch (e) {
    if (sid !== sessionId) return;
    note("loading session config failed: " + e.message);
  }
}
// Assigning a value no option carries reads back as "" (the default); a pick
// the server no longer offers is dropped rather than forced.
function applySessionConfig(cfg) {
  const set = (sel, v) => { sel.value = (v && [...sel.options].some((o) => o.value === v)) ? v : ""; };
  set($("omodel"), cfg.model || "");
  set($("oagent"), cfg.agent || "");
  set($("oeffort"), cfg.reasoning_effort || "");
  syncOvrSummary();
}
function resetPicks() {
  applySessionConfig({ model: "", agent: "", reasoning_effort: "" });
}
// Persist the current picks as the session's config. With no session yet the

// after the session is created.
async function persistPicks() {
  if (!sessionId) return;
  const body = { model: $("omodel").value, agent: $("oagent").value, reasoning_effort: $("oeffort").value };
  try { await api("/sessions/" + sessionId + "/config", { method: "POST", body: JSON.stringify(body) }); }
  catch (e) { note("saving session config failed: " + e.message); }
}
// A changed pick belongs to the session it was changed in: push it to the
// server instead of this browser's storage, and refresh the collapsed summary.
function savePick() {
  syncOvrSummary();

}
function fillSelect(sel, entries, currentLabel, kind) {
  const prev = sel.value;

  const def = document.createElement("option");
  def.value = "";
  // A phone-width select clips its text with no ellipsis, so the option keeps
  // only the short form: "model: server default (deepseek-…)" was reading as a
  // truncated "model: serve". The full label stays in the header line.
  const full = kind + ": server default" + (currentLabel ? " (" + currentLabel + ")" : "");
  def.textContent = kind + ": default";
  def.title = full;
  sel.title = full;
  sel.appendChild(def);
  for (const [v, label] of entries) {
    const o = document.createElement("option");
    o.value = v;
    o.textContent = label;
    sel.appendChild(o);
  }

}
async function loadInfo() {

    $("info").textContent = parts.join(" · ") + " (remote)";
    fillSelect($("omodel"), (info.models || []).map((m) => [m.id, m.label || m.id]), info.model_label || info.model, "model");
    fillSelect($("oagent"), (info.agents || []).map((a) => [a, a]), info.agent, "agent");
    fillSelect($("oeffort"), (info.efforts || []).map((e) => [e, e]), info.reasoning_effort, "effort");

// The drawer only highlights the current session while open, so mirror it

let sessFilter = "";
// Render the drawer from cached or fresh items: the filter narrows by title

// row keeps a failed refresh visible without wiping the last good list.
function renderSessionList(items, errText) {
  const q = sessFilter.trim().toLowerCase();
  const shown = q ? items.filter((s) => (sessionTitle(s) + " " + s.id).toLowerCase().includes(q)) : items;
  const ul = $("sesslist");
  ul.textContent = "";
  for (const s of shown) {
    const li = document.createElement("li");
    if (s.id === sessionId) li.className = "cur";
    const t = document.createElement("span");
    t.textContent = sessionTitle(s);
    const rn = document.createElement("button");
    rn.className = "rn";
    rn.textContent = "✎";
    rn.title = "rename";
    rn.onclick = (ev) => { ev.stopPropagation(); startRename(li, s); };
    const sm = document.createElement("small");
    sm.textContent = s.id.slice(0, 8);
    li.appendChild(rn);
    li.appendChild(t);
    li.appendChild(sm);
    // Desktop keeps the inline drawer open for repeated switching; the phone
    // drawer floats over the chat, so only it auto-closes after a pick.
    li.onclick = () => {
      sessionId = s.id;
      lastMsgCount = null;
      turnRunning = false;
      stopStaleFollow();

      // below rebuilds it for the one being opened.

// Swap one drawer row title for an inline editor: Enter/blur commits via
// POST /sessions/{id}/title, Esc cancels. A failed commit keeps the old
// title and surfaces as a tail row instead of silently sticking.
function startRename(li, s) {
  const old = sessionTitle(s);
  const inp = document.createElement("input");
  inp.className = "rnm";
  inp.value = old;
  inp.maxLength = 200;
  li.replaceChild(inp, li.querySelector("span"));
  inp.focus();
  inp.select();
  let done = false;
  const cancel = () => { if (done) return; done = true; renderSessionList(lastItems); };
  const commit = async () => {
    if (done) return; done = true;
    const v = inp.value.trim();
    if (!v || v === old) { renderSessionList(lastItems); return; }
    try {
      await api("/sessions/" + s.id + "/title", { method: "POST", body: JSON.stringify({ title: v }) });
      await loadSessions();
    } catch (e) {
      renderSessionList(lastItems, "rename failed: " + e.message);
    }
  };
  inp.onkeydown = (ev) => {
    if (ev.key === "Enter") commit();
    else if (ev.key === "Escape") cancel();
    ev.stopPropagation();
  };
  inp.onclick = (ev) => ev.stopPropagation();
  inp.onblur = commit;
}
async function loadSessions() {

    // Keep the last good list so one failed refresh (e.g. a token hiccup)
    // cannot hide every session; the error stays as a tail row instead.
    renderSessionList(lastItems, "sessions refresh failed: " + e.message);
    return;
  }
  // `/sessions` returns store order, which is oldest-first (the same order
  // `a /ss` prints and the server keeps unchanged). The drawer reads
  // newest-first, and the session auto-selected below is `items[0]`, so flip
  // the payload once here instead of in the renderer: the drawer, the filter
  // re-render, and the error path all then share one newest-first list.
  items.reverse();
  if (items.some((s) => s.id === sessionId)) { pendingNew = null; }
  else if (sessionId === pendingNew && sessionId) {
    // Fresh id, not yet materialized: stay on it; the first turn persists
    // it and the following loadSessions picks it up normally.
  }
  else if (!items.length) { sessionId = ""; pendingNew = null; turnRunning = false; resetPicks(); }
  else {
    pendingNew = null;
    sessionId = items[0].id;
    localStorage.setItem("serve.session", sessionId);
    // A running sample from the previous session must not leak onto the new
    // one; re-derive below (the id exists, so a poll is safe here).
    turnRunning = false;
    pollConfirm();
    await loadHistory();
    await loadSessionConfig();
  }
  lastItems = items;
  renderSessionList(items);
  renderSessionBar();
}
// History is append-only, so "the transcript changed" is one fingerprint of its

function histKey(msgs) {
  const tail = msgs[msgs.length - 1];
  return msgs.length + "|" + (tail ? tail.role + "|" + (tail.tool_call_id || "") + "|" + JSON.stringify(tail.content) : "");
}

}
// A session the server reports as running while this page holds no stream for

async function loadHistory() {
  $("msgs").textContent = "";
  revokePreviews(); // the transcript's previews belong to the session being left
  if (!sessionId) { addMsg("asst", "no session yet — tap ＋ to start one.", "asst"); return; }
  const forSession = sessionId; // the session this fetch describes, checked again before rendering
  let msgs = [];
  // One message beyond the rendered window: a tool result sitting at the edge
  // would otherwise be titled with a bare role name, because the call that
  // produced it is the message just outside. The extra one only feeds the call
  // index below, never the transcript.
  // Canonical message count backing the shown window: a tapped user bubble
  // maps to `histTotal - shown.length + bubble_index` for `POST /rewind`.
  // Older servers omit the header, so fall back to the fetched length.
  let histTotal = 0;

    const res = await api("/sessions/" + sessionId + "/history?limit=201");
    histTotal = Number(res.headers.get("x-history-total")) || 0;
    msgs = await res.json();
  }
  catch (e) {
    if (forSession !== sessionId) return; // a switch already re-rendered the transcript

    return;

  // first so each result can be titled by its call.
  const calls = new Map();
  for (const m of msgs) for (const c of m.tool_calls || []) if (c && c.id) calls.set(c.id, c);
  const histBase = Math.max(0, (histTotal || msgs.length) - shown.length);

    const m = shown[i];
    const t = textOf(m.content).trim();
    if (!t) continue;

    // messages carry a `reasoning_content` side channel (user text never
    // does), and the server re-validates the anchor anyway.
    if (m.role === "user" && !m.reasoning_content) addUserBubble(t, histBase + i);
    else if (m.role === "user") addMsg("user", t, "user");
    else if (m.role === "assistant") addMsgMd(t);
    else {
      const call = m.tool_call_id ? calls.get(m.tool_call_id) : null;
      addFold(call ? callLabel(call) : FOLD_ROLE_LABELS[m.role] || m.role, t.slice(0, 2000));

}
// Tapping a user input bubble offers a rewind to just before it, mirroring

function addUserBubble(text, index) {

  d.onclick = () => rewindTo(index, text);

}
async function rewindTo(index, preview) {
  const short = preview.length > 80 ? preview.slice(0, 79) + "…" : preview;
  if (!confirm("Rewind to just before:\n\n\"" + short + "\"\n\nThis message and everything after it will be removed. Continue?")) return;
  try {
    const res = await (await api("/sessions/" + sessionId + "/rewind", {
      method: "POST", body: JSON.stringify({ message_index: index }),
    })).json();
    await loadSessions();
    await loadHistory();
    addMsg("ok", "rewound: removed " + res.removed + " message(s).", "asst");
  } catch (e) { addMsg("err", "rewind failed: " + e.message, "asst err"); }
}

// The reply to a turn whose live feed died still lands in history, so the page
// follows it there: ticks with no change are skipped (a re-render pins the
// transcript to the bottom, which would fight someone scrolling an older
// session), the loop pauses while the page is hidden (a phone back in another
// app must not keep asking) and gives up after a bounded number of tries.
async function reloadStale() {
  if (!staleSession || staleSession !== sessionId || staleTries >= STALE_FOLLOW_TRIES) { stopStaleFollow(); return; }
  if (document.visibilityState !== "visible" || staleBusy) return;
  staleBusy = true;
  try {
    staleTries += 1;
    // The lost feed also loses the question a blocked turn is waiting on, and
    // the server keeps that question pending until it is answered: rebuild it
    // here so a reconnect mid-prompt can still answer it. This runs before the
    // "reply landed" exit below, because a question can stay pending while the
    // transcript already ends in an assistant message.
    await pollConfirm();
    if (staleDone) { stopStaleFollow(); return; }
    let msgs;
    try { msgs = await (await api("/sessions/" + sessionId + "/history?limit=201")).json(); }
    catch (_) { return; } // transient (hidden mid-flight, server restarting): retry next tick
    // The fetch can outlive the follow it belongs to (a new turn or another
    // session stops it, the page goes hidden): re-check before re-rendering.
    if (!staleSession || staleSession !== sessionId || document.visibilityState !== "visible") return;
    if (histKey(msgs) === staleKey) return;
    await loadHistory();
    if (staleDone) stopStaleFollow(); // the reply landed: nothing left to follow
  } finally { staleBusy = false; }
}
function stopStaleFollow() {
  if (staleTimer !== null) { clearInterval(staleTimer); staleTimer = null; }
  staleSession = "";
  staleTries = 0;
  syncStopButton();
}
function startStaleFollow() {
  if (!staleSession || staleSession !== sessionId || staleTimer !== null) return;
  if (document.visibilityState !== "visible") return; // becoming visible again is the other trigger
  staleTimer = setInterval(reloadStale, STALE_FOLLOW_MS);
  reloadStale();
  syncStopButton();
}

// --- turn confirmation ----------------------------------------------------
function hideConfirm() {
  confirmShown = null;
  $("confirmwrap").classList.remove("open");
  $("confirmerr").classList.remove("show");
  $("confirmerr").textContent = "";
}
function showConfirm(id, prompt, token) {
  confirmShown = { id: id, prompt: prompt, token: token };
  // Server text: textContent only, never innerHTML.
  $("confirmtext").textContent = prompt || "(no prompt text)";
  $("confirmerr").classList.remove("show");
  $("confirmerr").textContent = "";
  $("callow").disabled = false;
  $("cdeny").disabled = false;
  $("confirmwrap").classList.add("open");
}
async function answerConfirm(allow) {
  if (!confirmShown || confirmBusy) return;
  confirmBusy = true;
  $("callow").disabled = true;
  $("cdeny").disabled = true;
  // Remember which question this answer belongs to: a newer question can
  // arrive while the POST is in flight, and hiding it would strand the turn
  // with nothing on screen to answer.
  const answered = confirmShown.token;
  let gone = false; // a 409 is terminal: the server holds no such question
  try {
    await api("/sessions/" + sessionId + "/confirm", { method: "POST", body: JSON.stringify({ id: confirmShown.id, token: answered, allow: allow }) });
    if (confirmShown && confirmShown.token === answered) hideConfirm();
  } catch (e) {
    // Keep the question on screen: a transport failure must stay retryable.
    $("confirmerr").textContent = "answer failed: " + e.message;
    $("confirmerr").classList.add("show");
    $("callow").disabled = false;
    $("cdeny").disabled = false;
    gone = /^409\b/.test(e.message);
  } finally { confirmBusy = false; }
  // A 409 means the question is already gone (answered on another device, or
  // the turn ended): re-read the server state instead of leaving a dialog that
  // can only fail again. Transient failures stay open for a retry.
  if (gone) pollConfirm();
}
// Render whatever the server currently holds pending. A page that lost the
// feed (or was reloaded) mid-prompt has no live event to show the question, so
// it is rebuilt from /confirm through the same path the SSE event uses.
async function pollConfirm() {
  if (!sessionId || confirmBusy) return;
  const sid = sessionId;
  const epoch = runEpoch;
  let body;
  try { body = await (await api("/sessions/" + sid + "/confirm")).json(); }
  catch (_) { return; } // transient (hidden mid-flight, server restarting): retry next tick
  // The fetch can outlive what it describes (answered while it was in flight,
  // session switched, newer turn started): re-check before touching anything.
  if (confirmBusy || sid !== sessionId) return;
  if (epoch !== runEpoch) return; // a newer turn owns the button and the dialog now
  // The same poll reports a live turn for this session: the server is the only
  // source that survives this page losing the stream. A missing field means an
  // older server, treated as "not running".
  turnRunning = body.running === true;
  if (turnRunning) { turnRunningAt = Date.now(); armHistoryFollow(); }
  syncStopButton();
  const pending = body.pending;
  if (!pending) { if (confirmShown) hideConfirm(); return; }
  // The token, not the id, is the question's identity: child-side ids restart
  // at 1 every turn, so an equal id can still be different text.
  if (!confirmShown || confirmShown.token !== pending.token) showConfirm(pending.id, pending.prompt, pending.token);
}

// A turn is "running" when any of three independent sources says so: this page
// owns the live stream, the page lost the stream and is stale-following a turn
// whose reply has not landed, or the server said so at the last poll (and the
// sample is still fresh). Each is blind to a state the others cover (feed
// lost, page reloaded, another device).
function isTurnRunning() {
  const freshServerTurn = turnRunning && (Date.now() - turnRunningAt) < RUNNING_SAMPLE_TTL_MS;
  return turns.has(sessionId) || (staleSession === sessionId && !staleDone) || freshServerTurn;
}
// The one send/stop button reflects that predicate: stop glyph plus the stop
// class while a turn runs, the plain send look otherwise.
function syncStopButton() {
  const b = $("send");
  const running = isTurnRunning();
  b.textContent = running ? "⏹" : "➤";
  b.classList.toggle("stop", running);
  const label = running ? "stop this turn" : "send";
  b.setAttribute("aria-label", label);
  b.title = label;
}
// Transient note through the existing #connstat line; no new toast element.
function note(msg) {
  const el = $("connstat");
  el.textContent = msg;
  el.classList.add("show", "note");
  if (noteTimer !== null) clearTimeout(noteTimer);
  noteTimer = setTimeout(() => { el.classList.remove("show", "note"); noteTimer = null; }, 3000);
}
async function stopTurn() {
  if (stopBusy || !sessionId) return;
  stopBusy = true;
  let interrupted = false;
  try {
    const r = await (await api("/sessions/" + sessionId + "/interrupt", { method: "POST" })).json();
    interrupted = r.interrupted === true;
  } catch (e) {
    // Transport failure: surface it and let the next poll re-derive the state.
    note("stop failed: " + e.message);
    stopBusy = false;
    pollConfirm();
    return;
  }
  stopBusy = false;
  turnRunning = false; // the POST returned: the next poll re-asserts the truth
  if (interrupted) note("stopping…");
  else { note("no turn running"); await loadHistory(); await loadSessions(); }
  // The server is the truth for both the pending question and `running`, so an
  // interrupt that cancels a parked question also clears its dialog here.
  pollConfirm();
  syncStopButton();

// Parse one SSE block the way serve-chat does: `event: <kind>` plus one or
// more `data: <payload>` lines. Blocks without a kind are progress lines.
function parseBlock(raw) {
  let kind = "";
  const data = [];
  for (const line of raw.split("\n")) {
    if (line.startsWith("event:")) kind = line.slice(6).trim();
    else if (line.startsWith("data:")) data.push(line.slice(5).trimStart());
    else if (line.trim() === "" || line.startsWith(":")) continue; // blank or SSE keep-alive comment, never progress
    else data.push(line);
  }
  return { kind, payload: data.join("\n") };
}

async function send() {
  if (sendBusy) return; // one send's own setup at a time
  const text = $("prompt").value.trim();
  if (!text && !pendingImages.length) return;
  sendBusy = true;
  let sid;
  try {
    if (!sessionId) {
      try { sessionId = (await (await api("/sessions", { method: "POST" })).json()).id; }
      catch (e) { addMsg("err", "create session failed: " + e.message, "asst err"); return; }
      localStorage.setItem("serve.session", sessionId);
      persistPicks(); // picks made before any session existed belong to this one now
    }
    sid = sessionId;
    // One turn per session, but no longer one turn per page: a second session
    // can start while the first is still streaming (that is what the registry
    // is for). This session's own turn, or too many live ones, is what makes a
    // send wait.
    if (turns.has(sid)) { note("this session is already running a turn — stop it, or send from another session"); return; }
    if (turns.size >= MAX_LIVE_TURNS) { note("already streaming " + turns.size + " turns — wait for one to finish"); return; }
  } finally { sendBusy = false; } // the stream below owns itself: other sessions may send now
  let prompt = text;
  const images = pendingImages;
  pendingImages = [];
  // The file picker previews these same placeholders in the textarea, so
  // only append the ones the user has not already kept (or typed by hand).
  for (const im of images) if (!prompt.includes("[[image:" + im.filename + "]]")) prompt += (prompt && !prompt.endsWith("\n") ? "\n" : "") + "[[image:" + im.filename + "]]";
  // `confirm: true` tells the server this page renders and answers confirmation
  // requests; clients that cannot answer must not open a question nobody sees.
  const body = { prompt, confirm: true };
  if ($("omodel").value.trim()) body.model = $("omodel").value.trim();
  if ($("oagent").value.trim()) body.agent = $("oagent").value.trim();
  if ($("oeffort").value.trim()) body.reasoning_effort = $("oeffort").value.trim();
  if (images.length) body.images = images;
  $("prompt").value = "";
  $("prompt").style.height = "auto";
  if (text) addMsg("user", text, "user");
  else addMsg("user", "(images only)", "user");

  stopStaleFollow(); // this turn's own stream owns the view from here on
  runEpoch++; // late polls from any previous turn no longer vote on the button
  turnRunning = false; // this page's own feed is the running-turn truth now
  // Everything this turn writes goes into a container of its own, registered
  // under its session: the stream stays readable while the user works in
  // another session, and can be parked and re-attached without mixing turns.
  const box = document.createElement("div");
  box.className = "turn";
  $("msgs").appendChild(box);
  turns.set(sid, { box });
  syncStopButton(); // only now does isTurnRunning() see this session's own turn
  // Chronological DOM order: progress and thinking folds are created before
  // (or inserted ahead of) the reply bubble, so the trace reads top-down
  // and the final answer always lands last.
  const prog = addFold("progress", "", box);
  const bubble = addMsgMd("", box);
  let progLines = [];
  let think = null;
  // Reply text arrives token by token, and markdown has to be parsed over the
  // whole reply (an unterminated fence changes how every later line reads), so
  // deltas are coalesced into one repaint per interval instead of one per token.
  let raw = "";
  let paintTimer = null;
  const paint = () => {
    paintTimer = null;
    bubble.innerHTML = renderMarkdown(raw);
    decorateMath(bubble);
    if (sid === sessionId) $("msgs").scrollTop = $("msgs").scrollHeight;
  };
  const schedulePaint = () => { if (paintTimer === null) paintTimer = setTimeout(paint, 50); };
  const fail = (msg) => {
    if (paintTimer !== null) { clearTimeout(paintTimer); paintTimer = null; }
    bubble.classList.add("err");
    bubble.textContent = msg;
    prog.box.remove();
    if (think) think.box.remove();
  };
  // The POST is accepted before its first byte arrives, and the server keeps the
  // turn running even if this page goes away: only a server-sent `error` event is
  // a real turn failure, while a dead stream leaves a stale view (startStaleFollow).
  // A stream can also stall silently in the foreground (lost tail, half-dead
  // connection): reader.read() never resolves and no error ever fires, so the
  // page would wait forever on progress (N) + thinking. The watchdog below moves
  // such a stall to the same history-follow path as transport loss.
  let turnStarted = false;
  let turnError = false;
  const STREAM_STALL_MS = 60000; // no meaningful block for this long => stalled
  let stalled = false; // set by the watchdog; the read loop then exits via cancel
  let stallTimer = null;
  let reader = null; // assigned once the stream opens, so the watchdog can cancel it
  const armStall = () => {
    clearTimeout(stallTimer);
    stallTimer = setTimeout(() => { stalled = true; try { if (reader) reader.cancel(); } catch (_) {} }, STREAM_STALL_MS);
  };
  const goStale = (msg) => {
    staleSession = sessionId;
    staleTries = 0;
    // Until the first fetch below, staleDone still describes the transcript
    // from before this turn and would end the follow on its first tick.
    staleDone = false;
    fail(msg);
    startStaleFollow();
  };
  try {
    const res = await fetch(store.base + "/sessions/" + sessionId + "/turns/stream", {
      method: "POST", headers: headers(true), body: JSON.stringify(body),
    });
    if (!res.ok) {
      let detail = res.statusText;
      try { detail = (await res.json()).error || detail; } catch (_) {}
      throw new Error(res.status + " " + detail);
    }
    turnStarted = true;
    reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    armStall(); // the first meaningful block must arrive within STREAM_STALL_MS
    let finished = false;
    for (;;) {
      const { done, value } = await reader.read();
      if (value) buf += dec.decode(value, { stream: true });
      // Consume complete blocks; the tail may hold a partial block.
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const { kind, payload } = parseBlock(buf.slice(0, idx));
        buf = buf.slice(idx + 2);
        if (kind !== "" || payload) armStall(); // keep-alive comments (empty) must not mask a stalled turn
        if (kind === "done") { finished = true; break; }
        else if (kind === "error") { turnError = true; throw new Error(JSON.parse(payload).error || "turn failed"); }
        else if (kind === "delta") {
          try { raw += JSON.parse(payload).delta || ""; }
          catch (_) { raw += payload; }

        }
        else if (kind === "thinking_start") { think = addFold("thinking…", "", box); box.insertBefore(think.box, bubble); }
        else if (kind === "thinking") {
          try { if (think) think.body.textContent += JSON.parse(payload).text || ""; } catch (_) {}
        }
        else if (kind === "thinking_done") { if (think) think.box.querySelector("summary").textContent = "thinking"; }
        else if (kind === "confirm_request") {
          // Server text: showConfirm renders the prompt through textContent.
          // Only the session on screen can answer: the dialog answers into
          // `sessionId`, so a question from a turn in another session is left
          // pending on the server (the dialog shows when that session is
          // opened, because pollConfirm rebuilds it from /confirm).
          try { const c = JSON.parse(payload); if (sid === sessionId) showConfirm(c.id, c.prompt, c.token); } catch (_) {}
        }
        else if (kind === "confirm_done") {
          // Only the question this event closes goes away; a newer request can
          // only follow it, and an id-less event hides whatever is on screen.
          let cid = null;
          try { cid = JSON.parse(payload).id; } catch (_) {}
          if (sid === sessionId && (cid === null || (confirmShown && confirmShown.id === cid))) hideConfirm();
        }
        else if (payload) { progLines.push(payload); prog.set("progress (" + progLines.length + ")", progLines.slice(-50).join("\n")); }
        if (sid === sessionId) $("msgs").scrollTop = $("msgs").scrollHeight;
      }
      if (finished) break;
      if (done) break;
    }
    clearTimeout(stallTimer);
    if (paintTimer !== null) { clearTimeout(paintTimer); paint(); } // flush the tail
    decorateAndLoad(bubble); // reply paths become previews only once it is final
    if (stalled && !finished && !turnError) {
      // Only the session on screen can be followed from history here; a stalled
      // turn in a session the user has left is retired, and its reply is what
      // that session renders when it is opened again.
      if (sid === sessionId) goStale("stream stalled (no updates for 60s) — the turn keeps running on the server (following history)");
      else dropBackgroundTurn(box, "stream stalled");
    }
    else if (!raw) bubble.innerHTML = "<span style='color:var(--dim)'>(empty reply)</span>";
  } catch (e) {
    clearTimeout(stallTimer);
    if (turnStarted && !turnError) {
      // The POST was accepted and no server `error` event arrived, so this is
      // transport loss: the turn keeps running server-side and the view is
      // stale. Follow the transcript instead of declaring the turn dead — for
      // the session on screen only: a turn the user has left keeps running
      // unheard, and that session follows it from history when it comes back.
      if (sid === sessionId) goStale("connection lost: " + e.message + " — the turn keeps running on the server (following history)");
      else dropBackgroundTurn(box, "connection lost");
    } else fail("turn failed: " + e.message);
  }
  // This turn is over, so its session may send again: the entry goes away
  // whether or not the box stays on screen.
  turns.delete(sid);
  // The feed that just ended owns the truth about the turn it carried, same
  // as at stream start: the live-stream leg drops with the map entry above,
  // and a `turnRunning` sample taken mid-turn (screen locked, app switched)
  // must not outlive the `done` that proved the turn over. No
  // delayed poll follows on purpose: past `done`, server `running=true` can
  // only be reap lag (the child is reaped after OutputComplete) or a new
  // remote turn, and one boolean cannot tell them apart — latching it nailed
  // the button red for up to RUNNING_SAMPLE_TTL_MS. Event polls (return,
  // stale ticks, boot) re-derive the truth when there is something to see.
  // ... only for the session this feed belongs to: a sample that describes the
  // session on screen (some other session's turn) is not this stream's to clear.
  if (sid === sessionId) turnRunning = false;
  syncStopButton();
  // A box for a turn that finished while the user was elsewhere is dropped:
  // that session's transcript is rebuilt from history when it is opened, which
  // is where the finished reply lives. A box on screen stays, so the trace and
  // the reply remain readable without a reload.
  if (sid !== sessionId) box.remove();
  else $("msgs").scrollTop = $("msgs").scrollHeight;
  loadInfo();
  loadSessions();
}

// Length only, never the secret: separates "nothing stored" (0 chars, save

function showStored() {
  const el = $("connstat");

    msg = "stored token: " + (localStorage.getItem("serve.token") || "").length + " chars";
  } catch (e) {
    msg = "stored token: unreadable (" + (e && e.message ? e.message : e) + ")";
  }

function wire() {

  $("base").value = localStorage.getItem("serve.base") || "";
  $("token").value = localStorage.getItem("serve.token") || "";
  showStored();
  $("send").onclick = () => { if (isTurnRunning()) stopTurn(); else send(); };
  syncStopButton();
  // The dialog is the only way to unblock a turn that stopped to ask; both
  // answers post to /sessions/{id}/confirm through answerConfirm.
  $("callow").onclick = () => answerConfirm(true);
  $("cdeny").onclick = () => answerConfirm(false);
  // Android drops a backgrounded page's connections, and a page cannot see that
  // until it is visible again, so coming back is where recovery has to start.
  // A question the turn is blocked on survives a reconnect, so coming back to
  // the page is also where the confirm dialog has to be rebuilt.
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { pollConfirm(); startStaleFollow(); } });
  window.addEventListener("pageshow", () => { pollConfirm(); startStaleFollow(); }); // bfcache restore fires no visibility change
  if (window.matchMedia && matchMedia("(max-width: 700px)").matches) $("ovrwrap").open = false;
  $("scrim").onclick = () => setDrawer(false);
  $("omodel").onchange = () => savePick();
  $("oagent").onchange = () => savePick();
  $("oeffort").onchange = () => savePick();
  $("prompt").addEventListener("input", growPrompt);
  $("prompt").addEventListener("keydown", (e) => {
    // Plain Enter inserts a newline (mobile keyboards included); only the
    // send button — or Ctrl/Cmd+Enter for hardware keyboards — submits.
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); }
  });
  const toggleSessions = () => setDrawer(!$("sessions").classList.contains("open"));;
  $("menu").onclick = toggleSessions;
  $("sessbar").onclick = toggleSessions;
  $("sessfilter").oninput = (e) => { sessFilter = e.target.value; renderSessionList(lastItems); };
  $("connbtn").onclick = () => $("conn").classList.toggle("open");
  $("save").onclick = async () => {
    const b = $("base").value.trim().replace(/\/+$/, "");
    // Phones love appending a trailing space via autocomplete; that single
    // char is enough for a 401, so trim and write it back visibly.
    const t = $("token").value.trim();
    $("token").value = t;
    try {
      localStorage.setItem("serve.base", b);
      localStorage.setItem("serve.token", t);
    } catch (e) {
      // Blocked storage (private mode, locked-down WebView) throws here;
      // without this the tap silently does nothing and every call 401s.
      const el = $("connstat");
      el.textContent = "save failed: " + (e && e.message ? e.message : e);
      el.classList.add("show");
      return;
    }
    showStored();
    $("conn").classList.remove("open");
    await boot();
  };
  $("newbtn").onclick = async () => {
    try {
      sessionId = (await (await api("/sessions", { method: "POST" })).json()).id;
      pendingNew = sessionId;
      lastMsgCount = null;
      turnRunning = false; // fresh id: no turn can be running here (and it 404s a poll)
      localStorage.setItem("serve.session", sessionId);
      // The id is lazy (no history yet): show it optimistically instead of
      // loadHistory, which would 404 and print a scary red error, and let
      // loadSessions refresh only the drawer/bar around the pending id.
      $("msgs").textContent = "";
      addMsg("asst", "new session — type below to start.", "asst");
      await loadSessions();
      loadSessionConfig(); // a fresh session owns no config; clear the picks
    } catch (e) { addMsg("err", "create session failed: " + e.message, "asst err"); }
  };
  $("refresh").onclick = async () => { await loadSessions(); await loadHistory(); };
  $("fork").onclick = async () => {
    if (!sessionId) return;
    try {
      sessionId = (await (await api("/sessions/" + sessionId + "/fork", { method: "POST" })).json()).id;
      lastMsgCount = null;
      turnRunning = false; // a running turn (if any) belongs to the source session
      localStorage.setItem("serve.session", sessionId);
      await loadSessions(); await loadHistory();
      await loadSessionConfig(); // the fork inherits the source session's picks
    } catch (e) { addMsg("err", "fork failed: " + e.message, "asst err"); }
  };
  $("del").onclick = async () => {
    const cur = lastItems.find((x) => x.id === sessionId);
    if (!sessionId || !confirm("delete \"" + (cur ? sessionTitle(cur) : sessionId) + "\"?")) return;
    try {
      await api("/sessions/" + sessionId, { method: "DELETE" });
      sessionId = "";
      lastMsgCount = null;
      turnRunning = false;
      localStorage.removeItem("serve.session");
      await loadSessions(); await loadHistory();
    } catch (e) { addMsg("err", "delete failed: " + e.message, "asst err"); }
  };
  $("img").onclick = () => $("file").click();
  $("viewer").onclick = () => { $("viewer").classList.remove("on"); $("viewerimg").src = ""; };
  $("file").onchange = async () => {
    for (const f of $("file").files) {
      if (pendingImages.length >= 10) break;
      const dataUrl = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
      const b64 = String(dataUrl).split(",", 2)[1] || "";
      if (!b64) continue;
      const filename = (f.name || "image").replace(/[^\w.\-]+/g, "_");
      pendingImages.push({ filename, data_base64: b64 });
    }
    $("file").value = "";
    if (pendingImages.length && !$("prompt").value.includes("[[image:")) {
      $("prompt").value += ($("prompt").value && !$("prompt").value.endsWith("\n") ? "\n" : "") +
        pendingImages.map((im) => "[[image:" + im.filename + "]]").join("\n");
    }
  };
}
async function boot() {
  wire();
  try { await api("/healthz"); } catch (e) { $("info").textContent = "cannot reach server: " + e.message + " — tap ⚙"; return; }
  await loadInfo();
  await loadSessions();
  await loadHistory();
  await loadSessionConfig(); // restore this session's picks from the server
  pollConfirm(); // cold boot mid-turn (or a remote turn) has no live event; derive once
}
boot();
</script>
</body>
</html>
