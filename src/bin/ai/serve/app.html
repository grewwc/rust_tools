<html lang="en">
<head>

<title>a serve</title>
<script id="theme-boot">
/* Apply the stored theme before the first paint. The toggle itself lives in
   the page, but the palette has to be in place while the first frame is
   drawn, otherwise reloading in light mode flashes the dark palette. */
(function () {
  var p = "dark";
  try { p = localStorage.getItem("serve.theme") || "dark"; } catch (e) {}
  var t = p;
  if (p === "auto") {
    var light = false;
    try { light = !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches); } catch (e) {}
    t = light ? "light" : "dark";
  } else if (p !== "light" && p !== "warm" && p !== "dark") {
    p = "dark";
    t = "dark";
  }
  document.documentElement.setAttribute("data-theme", t);
  document.documentElement.setAttribute("data-theme-pref", p);
})();
</script>
<script id="viewport-boot">
/* Pin the app shell to the height the WebView actually shows. Some Android
   WebViews report a dynamic viewport taller than the visible area (the
   keyboard and the system bars are the usual gap), which pushed the composer
   below the screen and let the document scroll the header away. innerHeight
   and the visual viewport describe the area the page really got; pinch-zoom
   keeps the layout viewport, so it is ignored. */
(function () {
  var root = document.documentElement;
  function sync() {
    var vv = window.visualViewport;
    var height = vv && Math.abs(vv.scale - 1) < 0.01 && vv.height ? vv.height : window.innerHeight;
    if (height > 0) root.style.setProperty("--app-height", Math.round(height) + "px");
  }
  sync();
  window.addEventListener("resize", sync, false);
  window.addEventListener("orientationchange", sync, false);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", sync, false);
})();
</script>
<style>
/* Theme tokens. Dark is the default palette; the light palette is a sibling
   override selected by [data-theme="light"] on <html>. Every surface in the
   page is expressed through these tokens, so the toggle repaints the whole
   UI instead of leaving dark-only literals behind. */
:root {
  color-scheme: dark;
  --bg:#0d1117; --panel:#161b22; --line:#30363d; --fg:#e6edf3; --dim:#8b949e;
  --acc:#2f81f7; --ok:#3fb950; --err:#f85149;
  --surface:#21262d; --surface-hover:#30363d; --surface-2:#262d36; --line-2:#3a424d;
  --field:#0d1117; --code-bg:#0d1117; --media-bg:#080b10; --code-toolbar:#161b22;
  --acc-soft:#79c0ff; --acc-soft-2:#b6d8ff; --acc-line:#426b94; --acc-line-soft:rgba(88,166,255,.5);
  --acc-solid:#1f6feb; --acc-focus:#388bfd; --on-acc:#fff;
  --glass:rgba(22,27,34,.94); --glass-strong:rgba(22,27,34,.98);
  --tint:rgba(31,111,235,.16); --tint-2:rgba(31,111,235,.13); --tint-3:rgba(31,111,235,.33); --tint-4:rgba(31,111,235,.55);
  --composer-a:#1b2129; --composer-b:#151a21;
  --focus-ring:rgba(56,139,253,.18); --acc-shadow:rgba(31,111,235,.34); --glow:rgba(88,166,255,.75);
  --edge:rgba(255,255,255,.28);
  /* Reading weight. 450 resolves to the Medium face of Roboto / SF Pro and of
     Noto Sans CJK, and stays Regular where no Medium face exists, so body
     text gains body without turning bold. */
  --fw-text:450; --fw-meta:400;
}
:root[data-theme="light"] {
  color-scheme: light;
  /* Soft paper instead of pure white: a large #ffffff surface is what makes
     a light theme glare on a phone, so every area is a light grey and the
     contrast against the text is carried by the text, not by the background.
     The panel is the dominant surface (header, composer, assistant cards), so
     it stays a couple of steps below white and the page never reaches the
     luminance at which a phone screen turns into a lamp. */
  --bg:#e4e8ed; --panel:#eef1f5; --line:#ccd3db; --fg:#22272d; --dim:#57606a;
  --acc:#0a5cbe; --ok:#13702c; --err:#b8372a;
  --surface:#dbe0e6; --surface-hover:#d1d8e0; --surface-2:#e7ebef; --line-2:#c1c9d3;
  --field:#eef1f5; --code-bg:#e7ebf0; --media-bg:#dadee4; --code-toolbar:#e6eaef;
  --acc-soft:#0a5cbe; --acc-soft-2:#093c78; --acc-line:#6cb2f0; --acc-line-soft:rgba(10,92,190,.38);
  --acc-solid:#0a5cbe; --acc-focus:#0a5cbe; --on-acc:#ffffff;
  --glass:rgba(238,241,245,.95); --glass-strong:rgba(238,241,245,.98);
  --tint:rgba(10,92,190,.10); --tint-2:rgba(10,92,190,.08); --tint-3:rgba(10,92,190,.14); --tint-4:rgba(10,92,190,.22);
  --composer-a:#eef1f5; --composer-b:#e6eaef;
  --focus-ring:rgba(10,92,190,.16); --acc-shadow:rgba(10,92,190,.26); --glow:rgba(10,92,190,.30);
  --edge:rgba(34,39,45,.20);
}
/* Warm paper palette, the eye-comfort one: the same low luminance as the
   softened light palette, but the blue end of the spectrum is dropped, so the
   page reads as paper instead of a lit screen. */
:root[data-theme="warm"] {
  color-scheme: light;
  --bg:#e6dfd0; --panel:#efe9dd; --line:#d0c6b1; --fg:#37312a; --dim:#665d4e;
  --acc:#7d5220; --ok:#3f6b30; --err:#9c3222;
  --surface:#dcd4c2; --surface-hover:#d2c9b5; --surface-2:#eae3d5; --line-2:#c4b9a2;
  --field:#efe9dd; --code-bg:#e4dccb; --media-bg:#d9d1bf; --code-toolbar:#e2dac9;
  --acc-soft:#7d5220; --acc-soft-2:#5f3d15; --acc-line:#c09a68; --acc-line-soft:rgba(125,82,32,.38);
  --acc-solid:#7d5220; --acc-focus:#7d5220; --on-acc:#fbf7f0;
  --glass:rgba(239,233,221,.95); --glass-strong:rgba(239,233,221,.98);
  --tint:rgba(125,82,32,.10); --tint-2:rgba(125,82,32,.08); --tint-3:rgba(125,82,32,.14); --tint-4:rgba(125,82,32,.22);
  --composer-a:#efe9dd; --composer-b:#e5dece;
  --focus-ring:rgba(125,82,32,.18); --acc-shadow:rgba(125,82,32,.26); --glow:rgba(125,82,32,.30);
  --edge:rgba(55,49,42,.22);
}
/* Theme switch repaints smoothly instead of snapping. The list is explicit:
   elements that animate on their own (the jump button, the question
   highlight) keep their own timing because an ID rule outranks this one. */
body, header, #sessbar, #composer, #msgs, .msg, button, select, input, textarea,
#sessions, #conn, #connstat, #questionpanel, #skillmenu, #turnstatus,
.code-preview, .code-preview-toolbar, .code-block-toolbar, .mediaprev {
  transition: background-color .25s ease, color .25s ease, border-color .25s ease, box-shadow .25s ease;
}
* { box-sizing: border-box; }
html { height:100%; overflow:hidden; }
/* The document itself never scrolls: the message list is the only scroller and
   the header and composer stay put. Older engines use the 100vh fallback; the
   rest use the measured height when the dynamic viewport is unreliable. */
body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; display:flex; flex-direction:column; overflow:hidden;
  height:100vh; height:100dvh; height:var(--app-height, 100dvh); }
/* The font shorthand resets font-weight, so the reading weight has to be
   declared after it. */
body { font-weight:var(--fw-text); }
/* Secondary chrome keeps the Regular weight: the hierarchy is carried by
   colour and size, and 11-12px labels turn muddy at Medium. */
#info, #sesscount, #sessmeta, #turnstatus, #connstat, #confirmtitle, #confirmerr,
#skillhint, #skillmenu small, #sessions li small, #sessions li .rn,
#questionlist .empty, #ovrwrap > summary, .msg.pending, .msg details, .msg .prog,
.msg.md .li > .bullet, .msg.md blockquote, .msg.md .media-caption,
.msg.md .code-preview-toolbar button, .msg.md .code-preview-note,
.msg.md .code-block-toolbar .code-lang, .msg.md .code-block-toolbar button,
.mediaprev .mediacap { font-weight:var(--fw-meta); }
header { display:flex; align-items:center; gap:8px; padding:10px 12px; padding-top:calc(10px + env(safe-area-inset-top)); background:var(--panel); border-bottom:1px solid var(--line); }
header b { font-size:15px; }
#info { font-size:12px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
#apkdownload { display:none; }
#apkdownload svg { width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
/* Theme toggle: one icon per theme, showing the theme that is currently
   active, so the button always says where the page is. The accessible label
   names the theme the next press switches to. */
#themebtn {
  display:grid; place-items:center; flex:0 0 auto; width:38px; min-width:38px; height:34px; padding:0;
  border-radius:10px; color:var(--dim); background:var(--surface); border:1px solid var(--line);
}
#themebtn:hover { color:var(--acc); border-color:var(--acc-line); }
#themebtn svg { width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
#themebtn .moon { fill:currentColor; stroke:none; }
#themebtn .sun, #themebtn .moon, #themebtn .leaf { transform-origin:12px 12px; transition:opacity .25s ease, transform .35s cubic-bezier(.2,.8,.2,1); }
#themebtn .sun { opacity:0; transform:rotate(70deg) scale(.5); }
#themebtn .moon { opacity:1; transform:rotate(0deg) scale(1); }
#themebtn .leaf { opacity:0; transform:rotate(-70deg) scale(.5); }
:root[data-theme="light"] #themebtn .sun { opacity:1; transform:rotate(0deg) scale(1); }
:root[data-theme="light"] #themebtn .moon { opacity:0; transform:rotate(-70deg) scale(.5); }
:root[data-theme="warm"] #themebtn .sun { opacity:0; transform:rotate(70deg) scale(.5); }
:root[data-theme="warm"] #themebtn .moon { opacity:0; transform:rotate(-70deg) scale(.5); }
:root[data-theme="warm"] #themebtn .leaf { opacity:1; transform:rotate(0deg) scale(1); }
/* Theme picker in the settings panel: the header button cycles, this picks a
   theme directly, including "follow the system". */
#themepick { display:flex; gap:6px; flex:1 0 100%; }
#themepick button { flex:1; padding:7px 4px; font-size:13px; }
#themepick button[aria-pressed="true"] { background:var(--acc); border-color:var(--acc-solid); color:var(--on-acc); }
button, select, input, textarea { font:inherit; color:var(--fg); background:var(--field); border:1px solid var(--line); border-radius:8px; }
button { padding:7px 12px; background:var(--surface); cursor:pointer; touch-action:manipulation; }
button:disabled { opacity:.5; cursor:default; }
button.primary { background:var(--acc); border-color:var(--acc); color:var(--on-acc); }
/* While a turn runs the same button becomes the stop button; the stop state
   reuses --err the way .primary reuses --acc, and leaves the idle look alone. */
button.stop { background:var(--err); border-color:var(--err); color:var(--on-acc); }
#views { flex:1; display:flex; min-height:0; position:relative; }
#sessions { width:min(78vw,300px); border-right:1px solid var(--line); background:var(--panel); display:none; flex-direction:column; }
#sessions.open { display:flex; }
#sessions ul { list-style:none; margin:0; padding:8px; overflow-y:auto; flex:1; }
#sessions li { padding:8px; border-radius:8px; font-size:14px; }
#sessions li.cur { background:var(--tint-3); }
#sessions li.holding { background:var(--tint-4); }
#sessions li small { color:var(--dim); display:block; font-size:12px; }
#sessions li .rn { float:right; background:none; border:none; color:var(--dim); font-size:14px; padding:4px 10px; cursor:pointer; }
#sessions li .rnm { width:100%; font-size:inherit; box-sizing:border-box; }
#sessfilter { margin:8px 8px 0; padding:6px 8px; font-size:13px; width:calc(100% - 16px); box-sizing:border-box; }
#sesscount { padding:4px 12px 0; color:var(--dim); font-size:12px; }
#scrim { display:none; }
/* Desktop renders the override row exactly as before: the wrapper is
   transparent and its summary hidden (the phone query below undoes both). */
#ovrwrap { display:contents; }
#ovrwrap > summary { display:none; }
html { -webkit-text-size-adjust:100%; }
select, summary { touch-action:manipulation; }
.msg details summary { padding:10px 4px; cursor:pointer; }
/* 16px form text stops iOS Safari auto-zooming into focused fields;
   padding keeps the visual size small. */
#ovr select, #conn input, #sessfilter { font-size:16px; }
/* The token-length line is diagnostics: show it only while the conn panel
   is open instead of spending a permanent row on it. */
#conn:not(.open) + #connstat { display:none; }
#chat { flex:1; display:flex; flex-direction:column; min-width:0; }
#msgwrap { flex:1; min-height:0; position:relative; }
#msgs { position:absolute; top:0; right:0; bottom:0; left:0; box-sizing:border-box; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px; overscroll-behavior-y:contain; }
#turnstatus { padding:6px 12px; font-size:12px; color:var(--dim); border-top:1px solid var(--line); }
.turn { display:flex; flex-direction:column; gap:8px; min-width:0; }
.turn .tool-activity summary { color:var(--fg); }
.turn .tool-activity[data-running="true"] { border-color:var(--acc-line); }
#jumpbottom {
  display:none; position:absolute; right:16px; bottom:14px; z-index:3;
  width:46px; height:46px; padding:0; place-items:center; border-radius:50%;
  border:1px solid var(--edge); background:var(--acc-solid); color:var(--on-acc);
  box-shadow:0 8px 24px rgba(0,0,0,.38), 0 2px 6px rgba(31,111,235,.28);
  opacity:0; transform:translateY(8px) scale(.92); pointer-events:none;
  transition:opacity .18s ease, transform .18s ease, box-shadow .18s ease;
}
#jumpbottom svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
#jumpbottom:active { transform:translateY(1px) scale(.96); box-shadow:0 4px 14px rgba(0,0,0,.34); }
#questionbtn {
  display:none; position:relative; flex:0 0 auto; width:38px; min-width:38px; height:34px;
  padding:0; place-items:center; border-radius:10px; color:var(--dim); background:var(--surface);
}
#questionbtn svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; }
#questionbtn .count {
  position:absolute; top:-6px; right:-6px; min-width:18px; padding:1px 4px; border-radius:999px;
  background:var(--acc-solid); color:var(--on-acc); font-size:10px; line-height:16px;
}
#questionpanel {
  display:none; position:absolute; inset:10px 10px 8px; z-index:4; flex-direction:column;
  min-height:0; overflow:hidden; border:1px solid var(--line); border-radius:16px;
  background:var(--glass-strong); box-shadow:0 16px 48px rgba(0,0,0,.55);
}
#questionpanel.open { display:flex; }
#questionhead { display:flex; align-items:center; gap:8px; padding:12px; border-bottom:1px solid var(--line); }
#questionhead strong { flex:1; }
#questionclose { min-width:38px; min-height:38px; padding:0; border-radius:50%; }
#questionlist { min-height:0; overflow-y:auto; padding:8px; }
#questionlist .empty { padding:24px 12px; color:var(--dim); text-align:center; }
.question-link { display:flex; width:100%; margin:0 0 6px; padding:10px; gap:10px; text-align:left; background:var(--field); }
.question-link .num { flex:0 0 auto; color:var(--acc-soft); font-size:12px; }
.question-link .text { min-width:0; overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; white-space:normal; }
.msg.question-target { animation:question-target 1.6s ease-out; }
@keyframes question-target { 0%,30% { box-shadow:0 0 0 4px var(--glow); } 100% { box-shadow:none; } }
.msg { max-width:92%; padding:8px 12px; border-radius:12px; white-space:pre-wrap; word-break:break-word; font-size:15px;
  /* A hair of tracking keeps Chinese glyphs from crowding each other; monospace
     keeps its own metrics so code columns stay aligned. */
  letter-spacing:.01em; }
.msg.md pre, .msg.md code { letter-spacing:normal; }
.msg.pending { color:var(--dim); font-style:italic; }
.msg.user { align-self:flex-end; background:var(--acc-solid); color:var(--on-acc); }
/* Assistant cards span the row (capped by max-width) so a collapsed fold stays
   tappable across the whole card instead of only over its text. */
.msg.asst { align-self:stretch; background:var(--panel); border:1px solid var(--line); }
/* `touch-action:manipulation` keeps a double tap on a fold from zooming the page,
   so the second tap still lands as a click (see collapseFoldForTap). */
.msg details { font-size:13px; color:var(--dim); touch-action:manipulation; }
/* Desktop keeps the compact whole-bubble shortcut; phones use the explicit
   action below so a normal transcript tap cannot destroy history. */
.msg.rewindable { cursor:pointer; }
.user-msg-row { display:contents; }
.rewind-action { display:none; }
#sidenote { display:none; }
.msg .prog { font-size:13px; color:var(--dim); }
.msg.err { border-color:var(--err); color:var(--err); }
#ovr { display:flex; gap:8px; padding:10px 12px 0; }
/* Agent and effort keep the platform picker (its dropdown is the right phone
   interaction), but replace its default chrome with the app's field style: a
   stable touch target, a themed surface, and a chevron drawn from the palette
   so it follows every theme. */
#ovr select {
  flex:1; min-width:0; height:38px; padding:0 34px 0 12px;
  font-size:13px; font-weight:600; color:var(--fg);
  background-color:var(--surface);
  border:1px solid var(--line); border-radius:10px;
  -webkit-appearance:none; appearance:none;
  background-image:linear-gradient(45deg, transparent 50%, var(--dim) 50%),
    linear-gradient(135deg, var(--dim) 50%, transparent 50%);
  background-position:calc(100% - 17px) 50%, calc(100% - 12px) 50%;
  background-size:5px 5px, 5px 5px; background-repeat:no-repeat;
  box-shadow:0 1px 2px rgba(0,0,0,.12);
  text-overflow:ellipsis; white-space:nowrap; overflow:hidden; cursor:pointer;
}
@media (hover:hover) { #ovr select:hover { border-color:var(--line-2); } }
#ovr select:focus { border-color:var(--acc-focus); box-shadow:0 0 0 2px var(--focus-ring); outline:none; }
/* The platform draws a <select> popup itself and ignores option styling, so the
   model list uses a sheet instead. The select stays hidden as the value store:
   session config, the summary, and request code keep reading one source. */
#modelpickfield { flex:1; min-width:0; }
#omodelbtn {
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  width:100%; height:38px; padding:0 12px; text-align:left;
  font-size:16px; font-weight:600; color:var(--fg);
  background:var(--surface); border:1px solid var(--line); border-radius:10px;
  box-shadow:0 1px 2px rgba(0,0,0,.12);
  -webkit-appearance:none; appearance:none;
}
#omodelbtnlabel { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#omodelchev { flex:0 0 auto; width:7px; height:7px; margin-top:-3px; border-right:1.5px solid var(--dim); border-bottom:1.5px solid var(--dim); transform:rotate(45deg); }
@media (hover:hover) { #omodelbtn:hover { border-color:var(--line-2); } }
#omodelbtn:focus-visible { border-color:var(--acc-focus); box-shadow:0 0 0 2px var(--focus-ring); outline:none; }
#omodelbtn:disabled { opacity:.5; }
#modelpick[hidden] { display:none; }
#modelpick { position:fixed; inset:0; z-index:15; }
#modelpickscrim { position:absolute; inset:0; background:rgba(0,0,0,.55); animation:model-fade .18s ease-out; touch-action:none; }
/* Cap modal surfaces by the measured viewport height: dvh can resolve taller
   than the visible area in Android WebViews, which let this sheet grow past
   the screen and left its list unscrollable. */
#modelpickpanel {
  position:absolute; left:0; right:0; bottom:0; margin:0 auto;
  display:flex; flex-direction:column; width:min(100%,560px); max-height:82vh; max-height:calc(var(--app-height, 100vh) * .82);
  padding:0 12px calc(10px + env(safe-area-inset-bottom));
  background:var(--panel); border:1px solid var(--line); border-bottom:0;
  border-radius:22px 22px 0 0; box-shadow:0 -12px 40px rgba(0,0,0,.5);
  animation:model-up .24s cubic-bezier(.2,.8,.2,1);
}
#modelpickhandle { flex:0 0 auto; width:38px; height:4px; margin:8px auto 4px; border-radius:2px; background:var(--line-2); }
#modelpickhead { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:4px 4px 10px; }
#modelpicktitle { font-size:17px; font-weight:600; }
#modelpicknote { margin-top:2px; font-size:12px; color:var(--dim); }
#modelpickclose {
  flex:0 0 auto; display:grid; place-items:center; width:36px; height:36px; padding:0;
  border-radius:50%; background:var(--surface); color:var(--dim); font-size:22px; line-height:1;
}
@media (hover:hover) { #modelpickclose:hover { border-color:var(--line-2); color:var(--fg); } }
#modelpicklist { flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; touch-action:pan-y; padding:2px 0 4px; }
.modelrow {
  display:flex; align-items:center; gap:12px; width:100%; min-height:54px;
  padding:10px 12px; border:1px solid transparent; border-radius:12px;
  background:transparent; color:var(--fg); text-align:left;
}
.modelrow + .modelrow { margin-top:2px; }
.modelrow:active { background:var(--surface-hover); }
@media (hover:hover) { .modelrow:hover { background:var(--surface-2); } }
.modelrow[aria-selected="true"] { background:var(--tint-3); border-color:var(--acc-line-soft); }
#modelpicklist .modelrow:focus-visible { outline:2px solid var(--acc-focus); outline-offset:-2px; }
.modelrowtext { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.modelrowname { font-size:15px; font-weight:600; line-height:1.3; overflow-wrap:anywhere; }
.modelrowmeta { font-size:12px; color:var(--dim); overflow-wrap:anywhere; }

  } catch (e) { addMsg("err", "rewind failed: " + e.message, "asst err"); }
}

// The reply to a turn whose live feed died still lands in history, so the page
// follows it there: ticks with no change are skipped (a re-render pins the
// transcript to the bottom, which would fight someone scrolling an older
// session), the loop pauses while the page is hidden (a phone back in another
// app must not keep asking) and gives up after a bounded number of tries.
async function reloadStale() {
  if (!staleSession || staleSession !== sessionId || staleTries >= STALE_FOLLOW_TRIES) { stopStaleFollow(); return; }
  if (document.visibilityState !== "visible" || staleBusy) return;
  // A live event stream owns the truth again: it delivers the reply itself,
  // and a history refresh would take its view down with it.
  if (eventActive) return;
  const forSession = sessionId, epoch = runEpoch;
  staleBusy = true;
  try {
    staleTries += 1;
    // The lost feed also loses the question a blocked turn is waiting on, and
    // the server keeps that question pending until it is answered: rebuild it
    // here so a reconnect mid-prompt can still answer it. This runs before the
    // "reply landed" exit below, because a question can stay pending while the
    // transcript already ends in an assistant message.
    const running = await pollConfirm();
    if (sessionId !== forSession || runEpoch !== epoch || eventActive) return;
    if (staleDone) { stopStaleFollow(); return; }
    const loadId = ++historyLoadSeq;
    let msgs;
    let histTotal = 0;
    try {
      const res = await api("/sessions/" + forSession + "/history?limit=201");
      histTotal = Number(res.headers.get("x-history-total")) || 0;
      msgs = await res.json();
    }
    catch (_) { return; } // transient (hidden mid-flight, server restarting): retry next tick
    // The fetch can outlive the follow it belongs to (a new turn or another
    // session stops it, the page goes hidden): re-check before re-rendering.
    if (!staleSession || staleSession !== forSession || sessionId !== forSession
        || runEpoch !== epoch || loadId !== historyLoadSeq || eventActive || document.visibilityState !== "visible") return;
    if (histKey(msgs) !== staleKey) await loadHistory({ messages: msgs, histTotal, appendOnly: true });
    if (staleDone) { stopStaleFollow(); return; } // the reply landed: nothing left to follow
    // A successful server poll is authoritative. If it says the turn no longer
    // exists and history still has no final reply, a daemon restart or crash
    // ended the turn; do not leave the mobile UI stuck in stale-follow mode.
    if (running === false) {
      const box = staleBox;
      stopStaleFollow();
      if (box) {
        const bubble = box.querySelector(".bubble");
        if (bubble) bubble.textContent = "connection lost; server no longer reports this turn running (it may have restarted before finishing)";
      }
      note("turn ended before a final reply; you can send again");
      checkInterruptedTurn();
    }
  } finally { staleBusy = false; }
}
// A restart can end a turn between two page loads: the transcript then ends
// with the user's message and the server reports nothing running. Say so
// explicitly instead of leaving a blank-looking conversation.
function checkInterruptedTurn() {
  if (!sessionId || turnRunning || turns.has(sessionId)) return;
  if (!lastHistoryEndsUnanswered) return;
  const root = $("msgs");
  if (root.querySelector(".turn-interrupted")) return;
  addMsg("err", "这条消息没有收到回复：上一轮可能被服务重启中断。可以重新发送。", "asst err turn-interrupted");
}
// boot() returns early when its health check fails, before loading sessions,
// history or the session's picks. A later online/foreground resume (or the
// /info retry) calls this once the server is reachable again, so recovery ends
// in the same fully initialized page as a normal boot instead of a bare stream.
async function completeBoot() {
  if (bootComplete || bootCompleting) return;
  bootCompleting = true;
  try {
    void loadSkills();
    await loadSessions();
    if (!sessionId) { bootComplete = true; return; }
    if (historySession !== sessionId) await loadHistory();
    await loadSessionConfig();
    const running = await pollConfirm();
    checkInterruptedTurn();
    if (running !== null) bootComplete = true;
  } finally {
    bootCompleting = false;

}
// A phone that backgrounded the page or changed networks cannot trust its old
// socket. On return, ask the server for the authoritative running state, then
// either reattach the retained event stream or rebuild the transcript once.
// This does not wait for a stale mark, whose own timer may have been suspended
// while the page was hidden.
async function resumeSync() {
  if (!booted || resumeBusy) return;
  resumeBusy = true;
  try {
    void loadInfo();
    if (!bootComplete) {
      await completeBoot();
      if (!bootComplete) startStaleFollow();
      return;
    }
    const sid = sessionId, epoch = runEpoch;
    const hadEvents = eventActive;
    const running = await pollConfirm();
    if (sid !== sessionId || epoch !== runEpoch) return;
    checkInterruptedTurn();
    if (!sid) return;
    if (running === true) {
      if (turns.has(sid)) {
        const live = turns.get(sid);
        // Timers are throttled while hidden, so a dead socket can survive the
        // stream's own watchdog. A full stall window with no bytes means the
        // retained stream, not the turn, is gone: let the normal stale path
        // reattach instead of leaving the old "Thinking…" box on screen.
        if (live && Date.now() - (live.lastEventAt || 0) > LIVE_STALL_MS) live.recover?.();
      } else if (!eventActive) {
        void attachEvents();
      }
      startStaleFollow();
    } else if (running === false) {
      if (turns.has(sid)) {
        // The server says the turn is over, but this page's own feed never
        // delivered the terminal event. Release the reader; its normal
        // stale/history path renders the persisted reply.
        turns.get(sid)?.recover?.("server reports the turn ended — refreshing history", true);
      } else if (!hadEvents && !eventActive) {
        // The reply may have landed while the page was hidden or offline.
        await loadHistory();
      }
    } else {
      startStaleFollow();
    }
  } finally { resumeBusy = false; }
}
function stopStaleFollow() {
  if (staleTimer !== null) { clearInterval(staleTimer); staleTimer = null; }
  staleSession = "";
  staleBox = null;
  staleTries = 0;
  syncStopButton();
}
function startStaleFollow() {
  if (!staleSession || staleSession !== sessionId || staleTimer !== null) return;
  if (document.visibilityState !== "visible") return; // becoming visible again is the other trigger
  staleTimer = setInterval(reloadStale, STALE_FOLLOW_MS);
  reloadStale();
  syncStopButton();
}

// --- turn confirmation ----------------------------------------------------
function hideConfirm() {
  confirmShown = null;
  $("confirmwrap").classList.remove("open");
  $("confirmerr").classList.remove("show");
  $("confirmerr").textContent = "";
}
function showConfirm(id, prompt, token, input) {
  confirmShown = { id: id, prompt: prompt, token: token, input: !!input };
  // Server text: textContent only, never innerHTML.
  $("confirmtext").textContent = prompt || "(no prompt text)";
  $("confirminputrow").classList.toggle("show", !!input);
  $("confirminput").value = "";
  $("cdeny").textContent = input ? "Cancel" : "Deny";
  $("callow").textContent = input ? "Send" : "Allow";
  $("confirmerr").classList.remove("show");
  $("confirmerr").textContent = "";
  $("callow").disabled = false;
  $("cdeny").disabled = false;
  $("confirmwrap").classList.add("open");
}
async function answerConfirm(allow) {
  if (!confirmShown || confirmBusy) return;
  confirmBusy = true;
  $("callow").disabled = true;
  $("cdeny").disabled = true;
  // Remember which question this answer belongs to: a newer question can
  // arrive while the POST is in flight, and hiding it would strand the turn
  // with nothing on screen to answer.
  const answered = confirmShown.token;
  let gone = false; // a 409 is terminal: the server holds no such question
  try {
    const text = confirmShown.input ? $("confirminput").value : null;
    await api("/sessions/" + sessionId + "/confirm", { method: "POST", body: JSON.stringify({ id: confirmShown.id, token: answered, allow: allow, text: text }) });
    if (confirmShown && confirmShown.token === answered) hideConfirm();
  } catch (e) {
    // Keep the question on screen: a transport failure must stay retryable.
    $("confirmerr").textContent = "answer failed: " + e.message;
    $("confirmerr").classList.add("show");
    $("callow").disabled = false;
    $("cdeny").disabled = false;
    gone = /^409\b/.test(e.message);
  } finally { confirmBusy = false; }
  // A 409 means the question is already gone (answered on another device, or

  // can only fail again. Transient failures stay open for a retry.

}
// Render whatever the server currently holds pending. A page that lost the
// feed (or was reloaded) mid-prompt has no live event to show the question, so
// it is rebuilt from /confirm through the same path the SSE event uses. Returns
// the authoritative running state, or null when no current sample was obtained.
// A running turn can outlive this page's live stream and its bounded history
// follow. Native phone actions arrive as pending input requests, so keep
// polling /confirm while the server reports the turn running; otherwise a
// request created after the follow stops would block the turn forever.
function ensureConfirmPoll() {
  if (confirmPollTimer !== null) return;
  confirmPollTimer = setInterval(async () => {
    if (document.visibilityState !== "visible") return;
    const sid = sessionId, epoch = runEpoch;
    const running = await pollConfirm();
    if (sid !== sessionId || epoch !== runEpoch) return;
    if (running === false && !turns.has(sessionId) && staleSession !== sessionId) stopConfirmPoll();
  }, 10000); // fallback only; the reattached event stream is the primary path
}
function stopConfirmPoll() {
  if (confirmPollTimer === null) return;

  confirmPollTimer = null;
}
// Rebuild a compact progress card from replayed turn events. It is not the
// original live DOM, but it restores thinking, tool cards, the partial answer
// and any pending question after a page reload.
function recoveredProgressView() {
  const box = document.createElement("div");
  box.className = "turn recovered";
  let bubble = document.createElement("div");
  bubble.className = "msg asst";
  bubble.hidden = true;
  box.appendChild(bubble);
  const phaseBubble = document.createElement("div");
  phaseBubble.className = "msg asst pending";
  box.appendChild(phaseBubble);
  $("msgs").appendChild(box);
  const activity = createLiveActivity(box, bubble);
  const answerBubbles = [bubble];
  let think = null;
  let thinking = "";
  let answer = "";
  const sealAnswerSegment = () => {
    if (!bubble || bubble.dataset.segmentSealed) return;
    if (answer.trim()) {
      bubble.dataset.segmentSealed = "1";
      bubble.hidden = false;
      bubble.textContent = answer;
    } else {
      bubble.remove();
      answerBubbles.pop();
    }
    bubble = null;
    answer = "";
    activity.anchor(phaseBubble);
  };
  const ensureAnswerBubble = () => {
    if (bubble) return;
    bubble = document.createElement("div");
    bubble.className = "msg asst";
    bubble.hidden = true;
    box.insertBefore(bubble, phaseBubble);
    answerBubbles.push(bubble);
    activity.anchor(bubble);
  };
  const paintPhase = () => { phaseBubble.textContent = activity.label(); };
  const paintAnswer = () => {
    if (bubble) { bubble.hidden = !answer; bubble.textContent = answer; }
    activity.setPhase(answer ? "Responding…" : "Processing…");
    paintPhase();
  };
  const endThinking = () => { think = null; thinking = ""; };
  paintPhase();
  return {
    box,
    endThinking,
    sealAnswerSegment,
    thinkingText(text) {
      sealAnswerSegment();
      thinking += text;
      if (!think) think = createThinkingFold(box, phaseBubble);
      think.set("thinking", thinking.length > 6000 ? "…" + thinking.slice(-6000) : thinking);
      activity.setPhase("Thinking…");
      paintPhase();
    },
    delta(text) { endThinking(); ensureAnswerBubble(); answer += text; paintAnswer(); },
    replace(text) { endThinking(); ensureAnswerBubble(); answer = text; paintAnswer(); },
    tool(event) { endThinking(); sealAnswerSegment(); activity.setPhase("Processing…"); activity.tool(event); paintPhase(); },
    subagents(text) { activity.subagents(text); },
    phase(text, waiting) { activity.setPhase(text, waiting); paintPhase(); },
    remove() { box.remove(); },
  };
}

function handleReplayEvent(sid, kind, payload, view) {
  if (sid !== sessionId) return;
  if (kind === "thinking") {
    try { const text = JSON.parse(payload).text || ""; if (text) view.thinkingText(text); } catch (_) {}
  } else if (kind === "thinking_done") {
    view.endThinking();
    view.phase("Processing…");
  } else if (kind === "tool") {
    try { view.tool(JSON.parse(payload)); } catch (_) {}
  } else if (kind === "subagent_progress") {
    view.subagents(payload);
  } else if (kind === "delta") {
    try { view.delta(JSON.parse(payload).delta || ""); } catch (_) {}
  } else if (kind === "replace") {
    try { view.replace(JSON.parse(payload).text || ""); } catch (_) {}
  } else if (kind === "answer_pending") {
    view.phase("Processing response…");
  } else if (kind === "confirm_request") {
    view.phase("Waiting for confirmation…", true);
    try {
      const c = JSON.parse(payload);
      showConfirm(c.id, c.prompt, c.token, c.input);
    } catch (_) {}
  } else if (kind === "input_request") {
    let c = null;
    try { c = JSON.parse(payload); } catch (_) {}
    if (c && typeof c.prompt === "string" && c.prompt.startsWith(NATIVE_PREFIX)) {
      view.phase("正在手机上执行…", true);
      void handleNativeRequest(c.id, c.token, c.prompt);
    } else if (c) {
      view.phase("Waiting for your input…", true);
      showConfirm(c.id, c.prompt, c.token, true);
    }
  } else if (kind === "confirm_done" || kind === "input_done") {
    let cid = null;
    try { cid = JSON.parse(payload).id; } catch (_) {}
    if (cid === null || (confirmShown && confirmShown.id === cid)) hideConfirm();
    view.phase("Processing…");
  }
}

// Reattach to the running turn's retained event stream. This is the primary
// path after a reload: it replays progress and delivers a pending native or
// confirmation request without waiting for a poll interval.
async function attachEvents() {
  if (!sessionId || eventActive || turns.has(sessionId) || eventFailures >= 5) return;
  const sid = sessionId;
  const epoch = runEpoch;
  const controller = new AbortController();
  eventAbort = controller;
  eventActive = true;
  eventSession = sid;
  syncStopButton();
  ensureConfirmPoll();
  const view = recoveredProgressView();
  recoveredView = view;
  view.phase("Reconnecting…");
  let buf = "";
  let finished = false;
  let timedOut = false, waiting = false;
  let silenceTimer = null, progressTimer = null;
  const ownsStream = () => sid === sessionId && epoch === runEpoch && eventAbort === controller;
  const expire = () => { if (ownsStream()) { timedOut = true; controller.abort(); } };
  const armSilence = () => {
    clearTimeout(silenceTimer);
    silenceTimer = setTimeout(expire, 25000);
  };
  const armProgress = () => {
    clearTimeout(progressTimer);
    progressTimer = setTimeout(() => {
      if (waiting || confirmShown) armProgress();
      else expire();
    }, 5 * 60 * 1000);
  };
  armSilence(); // Covers both response headers and a reader that never resolves.
  armProgress();
  try {
    // This connection builds a fresh view; a cursor from a discarded view
    // would skip the very events needed to reconstruct its state.
    const eventsUrl = store.base + "/sessions/" + sid + "/events?after=0";
    const res = await fetch(eventsUrl, {
      headers: headers(false), signal: controller.signal,
    });
    if (!res.ok || !res.body) throw new Error("event stream " + res.status);
    if (!ownsStream() || controller.signal.aborted) return;
    armSilence();
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    for (;;) {
      const { done, value } = await reader.read();
      if (!ownsStream() || controller.signal.aborted) return;
      if (value && value.length) armSilence();
      if (value) buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const block = parseBlock(buf.slice(0, idx));
        buf = buf.slice(idx + 2);
        if (block.kind === "done") {
          finished = true; eventStreamEnded = true; eventFailures = 0; confirmPollSeq++;
          break;
        }
        if (block.kind) {
          if (block.kind === "confirm_request" || block.kind === "input_request") waiting = true;
          if (block.kind === "confirm_done" || block.kind === "input_done") waiting = false;
          armProgress();
          handleReplayEvent(sid, block.kind, block.payload, view);
        }
      }
      if (finished || done) break;
    }
  } catch (error) {
    if (!controller.signal.aborted && ownsStream() && !String(error.message).includes("404")) {
      addMsg("err", "live progress unavailable: " + error.message, "asst err");
    }
  } finally {
    clearTimeout(silenceTimer);
    clearTimeout(progressTimer);
    const owned = ownsStream();
    view.remove();
    if (recoveredView === view) recoveredView = null;
    if (eventAbort === controller) { eventAbort = null; eventActive = false; eventSession = ""; syncStopButton(); }
    const fresh = turnRunning && Date.now() - turnRunningAt < RUNNING_SAMPLE_TTL_MS;
    if (!owned) return;
    if (!finished && (timedOut || !controller.signal.aborted)) eventFailures++;
    if (!finished && fresh && !turns.has(sid) && eventFailures < 5 && (timedOut || !controller.signal.aborted)) {
      ensureConfirmPoll(); // fallback while the event stream is down
      setTimeout(() => {
        if (sid === sessionId && epoch === runEpoch) void attachEvents();
      }, 2000);
    } else if (!turns.has(sid) && (timedOut || !controller.signal.aborted)) {
      await loadHistory();
    }
  }
}

function abortEvents() {
  eventFailures = 0;
  if (eventAbort) { eventAbort.abort(); eventAbort = null; }
  eventActive = false;
  eventSession = "";
  eventStreamEnded = false;
  if (recoveredView) { recoveredView.remove(); recoveredView = null; }
}

async function pollConfirm() {
  if (!sessionId || confirmBusy) return null;
  const seq = ++confirmPollSeq;
  const sid = sessionId;
  const epoch = runEpoch;
  let body;
  try { body = await (await api("/sessions/" + sid + "/confirm")).json(); }
  catch (_) { return null; } // transient (hidden mid-flight, server restarting): retry next tick
  // The fetch can outlive what it describes (answered while it was in flight,
  // session switched, newer turn started): re-check before touching anything.
  if (confirmBusy || sid !== sessionId) return null;
  if (epoch !== runEpoch || seq !== confirmPollSeq) return null;
  // The same poll reports a live turn for this session: the server is the only
  // source that survives this page losing the stream. A missing field means an
  // older server, treated as "not running".
  const wasRunning = turnRunning;
  turnRunning = body.running === true;
  if (turnRunning) {
    turnRunningAt = Date.now();
    armHistoryFollow();
    ensureConfirmPoll();
    // A stream that closed with the terminal marker belongs to a finished
    // turn: the server already said so. Re-attaching on every poll would
    // rebuild the progress view and re-render the transcript each time. A new
    // turn (running flipped back to true) starts a fresh stream.
    if (!wasRunning) { eventStreamEnded = false; eventFailures = 0; }
    if (!eventStreamEnded) void attachEvents();
  }
  else {
    eventStreamEnded = false;
    if (eventActive && eventSession === sid) {
      abortEvents();
      await loadHistory();
      if (sid !== sessionId || epoch !== runEpoch || seq !== confirmPollSeq) return null;
    }
    if (!turns.has(sessionId) && staleSession !== sessionId) stopConfirmPoll();
  }
  syncStopButton();
  const pending = body.pending;
  if (!pending) { if (confirmShown) hideConfirm(); return turnRunning; }
  if (pending.input && typeof pending.prompt === "string" && pending.prompt.startsWith(NATIVE_PREFIX)) {
    if (confirmShown) hideConfirm();
    void handleNativeRequest(pending.id, pending.token, pending.prompt);
    return turnRunning;
  }
  // The token, not the id, is the question's identity: child-side ids restart
  // at 1 every turn, so an equal id can still be different text.
  if (!confirmShown || confirmShown.token !== pending.token) showConfirm(pending.id, pending.prompt, pending.token, pending.input);
  return turnRunning;
}

// A turn is "running" when any of three independent sources says so: this page
// owns the live stream, the page lost the stream and is stale-following a turn
// whose reply has not landed, or the server said so at the last poll (and the
// sample is still fresh). Each is blind to a state the others cover (feed
// lost, page reloaded, another device).
function isTurnRunning() {
  const freshServerTurn = turnRunning && (Date.now() - turnRunningAt) < RUNNING_SAMPLE_TTL_MS;
  return turns.has(sessionId) || (staleSession === sessionId && !staleDone) || freshServerTurn;
}
// The one send/stop button reflects that predicate: stop glyph plus the stop
// class while a turn runs, the plain send look otherwise.
function syncStopButton() {
  const b = $("send");

  b.textContent = running ? "⏹" : "➤";
  b.classList.toggle("stop", running);
  const label = running ? "stop this turn" : "send";
  b.setAttribute("aria-label", label);
  b.title = label;

  sideNote.setAttribute("aria-hidden", String(!running));

  // resizes the focused field. That waits for a composition to end.
  holdLayout("sideNote", () => {
    $("composer").classList.toggle("side-note-ready", running);
    sideNote.classList.toggle("show", running);
  });

  // inventing a model phase or inserting status rows into canonical history.
  const status = $("turnstatus");
  const attachedEvents = eventActive && eventSession === sessionId;
  const detached = sessionId && running && !turns.has(sessionId) && !attachedEvents;
  const fresh = turnRunning && Date.now() - turnRunningAt < RUNNING_SAMPLE_TTL_MS;
  const text = !detached ? "" : fresh
    ? "Turn running on server · live updates unavailable"
    : "Live connection lost · checking server history…";

  // wrap it to another line, and showing or hiding it moves the focused field.
  holdLayout("status", () => {
    if (status.textContent !== text) status.textContent = text;
    status.hidden = !text;

    clearTimeout(noteTimer);

function hideNote() {

}
async function sendSideNote() {
  if (sideNoteBusy || !sessionId) return;
  const input = $("prompt");
  const draft = input.value;
  const text = draft.trim();
  if (!text) {
    note("type a side note first");
    input.focus();
    return;
  }
  if (pendingImages.length) {
    note("side notes are text only — send the pending images after this turn");
    return;
  }

  // running-state poll, or let that wait change the target session or text.
  const targetSession = sessionId;
  sideNoteBusy = true;
  $("sidenote").disabled = true;
  note("sending side note…");
  try {
    await api("/sessions/" + targetSession + "/side-notes", {
      method: "POST", body: JSON.stringify({ text }),
    });
    // Do not erase a different session's draft, or text added while the POST
    // was in flight. In either case the submitted note was still queued.
    if (sessionId === targetSession && input.value === draft) {
      input.value = "";
      input.style.height = "auto";
      clearDraft(targetSession);
    }
    note("side note queued — applies at the next model request");
  } catch (e) {
    note("side note failed: " + e.message);

    sideNoteBusy = false;
    $("sidenote").disabled = false;
  }
}
async function stopTurn() {
  if (stopBusy || !sessionId) return;
  stopBusy = true;

  try {

    interrupted = r.interrupted === true;

  turnRunning = false; // the POST returned: the next poll re-asserts the truth
  if (interrupted) note("stopping…");
  else { note("no turn running"); await loadHistory(); await loadSessions(); }
  // The server is the truth for both the pending question and `running`, so an
  // interrupt that cancels a parked question also clears its dialog here.
  pollConfirm();
  syncStopButton();
}

// Parse one SSE block the way serve-chat does: `event: <kind>` plus one or
// more `data: <payload>` lines. Blocks without a kind are progress lines.
function parseBlock(raw) {
  let id = "";
  let kind = "";
  const data = [];
  for (const line of raw.split("\n")) {
    if (line.startsWith("id:")) id = line.slice(3).trim();
    else if (line.startsWith("event:")) kind = line.slice(6).trim();
    else if (line.startsWith("data:")) data.push(line.slice(5).trimStart());
    else if (line.trim() === "" || line.startsWith(":")) continue; // blank or SSE keep-alive comment, never progress
    else data.push(line);
  }
  return { id, kind, payload: data.join("\n") };
}

// `/cd` changes the session's working directory on the server, not the turn
// child's: a child that ran it exits and takes the change with it, so the next
// turn is back in the old directory. Mobile answers the command locally
// through the session endpoint instead of starting a turn.
const CD_LINE_RE = /^[:/]cd(?:\s|$)/;
function cdCommandLine(text) {
  const t = text.trim();
  return t && !t.includes("\n") && CD_LINE_RE.test(t) ? t : "";
}

async function runCdCommand(text) {
  const command = cdCommandLine(text);
  if (!command || pendingImages.length) return false;
  if (!sessionId) {
    try { sessionId = (await (await api("/sessions", { method: "POST" })).json()).id; }
    catch (e) { addMsg("err", "create session failed: " + e.message, "asst err"); return true; }
    localStorage.setItem("serve.session", sessionId);
  }
  const sid = sessionId;
  setPromptValue("", true);
  $("prompt").style.height = "auto";
  clearDraft(sid);
  addMsg("user", command, "user rewindable");
  let out = "";
  try {
    const res = await api("/sessions/" + sid + "/cd", { method: "POST", body: JSON.stringify({ command }) });
    if (!res.ok) {
      let detail = res.statusText;
      try { detail = (await res.json()).error || detail; } catch (_) {}
      throw new Error(res.status + " " + detail);
    }
    const data = await res.json();
    out = [data.stdout || "", data.stderr || ""].filter(Boolean).join("\n").trim();
  } catch (e) {
    addMsg("err", "cd failed: " + e.message, "asst err");
    return true;
  }
  const last = out.split("\n").filter(Boolean).pop() || "done";
  addFold("activity log (1) · " + shortLine(last, 80), out).box.classList.add("tool-activity");
  scrollToLatest(false);
  return true;
}

async function send() {
  if (sendBusy) return; // one send's own setup at a time
  if (typeof abortEvents === "function") abortEvents();
  // Send the textarea bytes as typed: the server stores them unchanged, so a
  // client-side trim would make the transcript differ from the input. The
  // trimmed view only decides whether there is anything to send.
  const text = $("prompt").value;
  if (!text.trim() && !pendingImages.length) return;
  if (!validateSkillInput()) return;

  // A cd line belongs to the session, not to this turn (see runCdCommand).
  if (await runCdCommand(text)) return;
  const draftSession = sessionId;
  sendBusy = true;
  let sid;
  try {
    if (!sessionId) {
      try { sessionId = (await (await api("/sessions", { method: "POST" })).json()).id; }
      catch (e) { addMsg("err", "create session failed: " + e.message, "asst err"); return; }
      localStorage.setItem("serve.session", sessionId);
      carrySkillPick(draftSession, sessionId);
      persistPicks(); // picks made before any session existed belong to this one now
    }
    sid = sessionId;
    // One turn per session, but no longer one turn per page: a second session
    // can start while the first is still streaming (that is what the registry
    // is for). This session's own turn, or too many live ones, is what makes a
    // send wait.
    if (turns.has(sid)) { note("this session is already running a turn — stop it, or send from another session"); return; }
    if (turns.size >= MAX_LIVE_TURNS) { note("already streaming " + turns.size + " turns — wait for one to finish"); return; }
  } finally { sendBusy = false; } // the stream below owns itself: other sessions may send now
  if (!validateSkillInput()) return;
  const rewindFloor = historySession === sid ? canonicalHistoryTotal : 0;
  let prompt = text;
  const images = pendingImages;
  pendingImages = [];
  // The file picker previews these same placeholders in the textarea, so
  // only append the ones the user has not already kept (or typed by hand).
  for (const im of images) if (!prompt.includes("[[image:" + im.filename + "]]")) prompt += (prompt && !prompt.endsWith("\n") ? "\n" : "") + "[[image:" + im.filename + "]]";
  // `confirm: true` tells the server this page renders and answers confirmation
  // requests; clients that cannot answer must not open a question nobody sees.
  const body = { prompt, confirm: true };
  const skillSelection = captureSkillPick();
  if (skillSelection.skills.length) body.skills = skillSelection.skills;
  if ($("omodel").value.trim()) body.model = $("omodel").value.trim();
  if ($("oagent").value.trim()) body.agent = $("oagent").value.trim();
  if ($("oeffort").value.trim()) body.reasoning_effort = $("oeffort").value.trim();
  if (images.length) body.images = images;
  setPromptValue("", true); // the user asked for this write, so it goes through
  $("prompt").style.height = "auto";
  clearDraft(draftSession);
  clearDraft(sid);
  questionCache = null;
  document.querySelectorAll("#msgs .turn-interrupted").forEach((node) => node.remove());
  lastHistoryEndsUnanswered = false;
  const userBubble = addLiveUserBubble(text.trim() ? text : "(images only)", prompt, sid, rewindFloor);
  const pendingInputs = pendingUserInputs.get(sid) || [];
  // `settled` flips once the turn's POST is accepted: from then on this input
  // is in canonical history, so an exact text match anywhere in the transcript
  // belongs to it. Before that, a match may still be an older identical input.
  const userInput = { row: userBubble.parentNode, prompt, minIndex: rewindFloor, settled: false };
  pendingInputs.push(userInput);
  pendingUserInputs.set(sid, pendingInputs);
  scrollToLatest(false);

  stopStaleFollow(); // this turn's own stream owns the view from here on
  runEpoch++; // late polls from any previous turn no longer vote on the button
  turnRunning = false; // this page's own feed is the running-turn truth now
  // Everything this turn writes goes into a container of its own, registered
  // under its session: the stream stays readable while the user works in
  // another session, and can be parked and re-attached without mixing turns.
  const box = document.createElement("div");
  box.className = "turn";
  $("msgs").appendChild(box);
  // The stream's watchdog and a foreground resume both need to know whether
  // this feed is still moving. `recover` runs the same cancel path as the
  // timer, but from outside the send() closure.
  let stalled = false;
  let recoverReason = ""; // set when a foreground resync, not the timer, stopped the feed
  let recoverEnded = false; // the server said the turn is already over
  let reader = null;
  const liveEntry = {
    box,
    lastEventAt: Date.now(),
    recover: (reason = "", ended = false) => {
      recoverReason = reason;
      recoverEnded = ended;
      stalled = !reason;
      try { if (reader) reader.cancel(); } catch (_) {}
    },
  };
  turns.set(sid, liveEntry);
  syncStopButton(); // only now does isTurnRunning() see this session's own turn
  // Progress and thinking folds are inserted lazily in stream order ahead of
  // the final reply, so tool phases remain visible between reasoning phases.
  let bubble = addMsgMd("", box);
  bubble.hidden = true;
  // One model response can emit prose, call tools, then emit more prose. Each
  // prose round is a separate canonical assistant message, so it gets its own
  // live bubble instead of being concatenated into the first one.
  const answerBubbles = [bubble];
  const phaseBubble = addMsgMd("", box);
  phaseBubble.classList.add("pending");
  const activity = createLiveActivity(box, bubble);
  const clockStart = Date.now();
  const phaseLine = () => "◌ " + activity.label() + " · " + formatElapsed(Date.now() - clockStart);
  const phaseTimer = setInterval(() => {
    // The box is parked while the user reads another session; keep the clock
    // live through that detach so it is current when attachLiveBox restores it.
    if (turns.get(sid) !== liveEntry) { clearInterval(phaseTimer); return; }
    phaseBubble.textContent = phaseLine();
  }, 1000);
  let activityDirty = true;
  const setPhase = (label, waiting = false) => {
    activity.setPhase(label, waiting);
    activityDirty = true;
    schedulePaint();
  };
  let prog = null;
  let progDetails = null;
  let progLines = [];
  let subagentProgress = "";
  const progressFolds = [];
  const ensureProgressPhase = () => {
    if (prog) return;
    prog = addFold("activity log", "", box);
    box.insertBefore(prog.box, bubble);
    progDetails = prog.box.querySelector("details");
    progressFolds.push(prog);
  };
  const renderProgress = () => {
    const visible = progLines.slice(-50);
    prog.set("activity log (" + progLines.length + ") · " + shortLine(visible[visible.length - 1] || "", 80), visible.join("\n"));
  };
  let think = null;
  let thinkRaw = "";
  const thinkingFolds = [];
  let answerDirty = false;
  let progressDirty = false;
  let expandProgress = false;
  let thinkingDirty = false;
  let thinkingDoneDirty = false;
  // Stream events can outpace a phone's display. Coalesce answer, thinking and
  // progress writes so each interval performs at most one layout/follow pass.
  // Markdown still renders from the complete reply because an unfinished fence
  // can change how all following lines are interpreted.
  let raw = "";
  let paintTimer = null;
  const paint = () => {
    paintTimer = null;
    if (!answerDirty && !progressDirty && !thinkingDirty && !thinkingDoneDirty && !activityDirty) return;
    const follow = sid === sessionId && shouldFollowOutput();
    if (activityDirty) {
      phaseBubble.textContent = phaseLine();
      activityDirty = false;
    }
    if (progressDirty && prog) {
      if (expandProgress) progDetails.open = true;
      renderProgress();
      progressDirty = false;
      expandProgress = false;
    }
    if (thinkingDirty && think) {
      think.body.textContent = thinkRaw;
      thinkingDirty = false;
    }
    if (thinkingDoneDirty && think) {
      think.box.querySelector("summary").textContent = "thinking";
      thinkingDoneDirty = false;
    }
    if (answerDirty) {
      bubble.hidden = !raw;
      bubble.classList.remove("pending");
      bubble.innerHTML = renderMarkdown(raw, false);
      // The formulas are not typeset while the reply is still arriving: the
      // bubble is rebuilt on every paint, so every formula would be typeset
      // again and again. The finished reply is typeset once, at the end.
      answerDirty = false;
    }
    if (sid === sessionId) followOutput(follow);
  };
  const schedulePaint = () => { if (paintTimer === null) paintTimer = setTimeout(paint, replyPaintDelay(raw.length)); };
  const flushPaint = () => {
    if (paintTimer !== null) { clearTimeout(paintTimer); paintTimer = null; }
    paint();
  };
  // Finalize the current prose round as its own bubble once a tool call or a new
  // thinking phase starts. The next streamed text opens a fresh bubble, matching
  // the separate assistant messages canonical history stores per model response.
  const sealAnswerSegment = () => {
    if (!bubble || bubble.dataset.segmentSealed) return;
    if (raw.trim()) {
      bubble.dataset.segmentSealed = "1";
      bubble.hidden = false;
      bubble.classList.remove("pending");
      bubble.innerHTML = renderMarkdown(raw, false);
      decorateAndLoad(bubble);
    } else {
      bubble.remove();
      answerBubbles.pop();
    }
    bubble = null;
    raw = "";
    answerDirty = false;
    activity.anchor(phaseBubble);
  };
  const ensureAnswerBubble = () => {
    if (bubble) return;
    bubble = addMsgMd("", box);
    bubble.hidden = true;
    box.insertBefore(bubble, phaseBubble);
    answerBubbles.push(bubble);
    activity.anchor(bubble);
  };
  const closeThinkingPhase = () => {
    if (!think) return;
    thinkingDoneDirty = true;
    flushPaint();
    think = null;
    thinkRaw = "";
  };
  const mutateTranscript = (mutation) => {
    const follow = sid === sessionId && shouldFollowOutput();
    mutation();
    if (sid === sessionId) followOutput(follow);
  };
  const fail = (msg) => {
    if (paintTimer !== null) { clearTimeout(paintTimer); paintTimer = null; }
    if (sid === sessionId) confirmPollSeq++;
    activity.finish("interrupted");
    activityDirty = false;
    phaseBubble.remove();
    if (!bubble) { bubble = addMsgMd("", box); box.appendChild(bubble); answerBubbles.push(bubble); }
    bubble.hidden = false;
    bubble.classList.remove("pending");
    bubble.classList.add("err");
    bubble.textContent = msg;
  };
  // The POST is accepted before its first byte arrives, and the server keeps the
  // turn running even if this page goes away: only a server-sent `error` event is
  // a real turn failure, while a dead stream leaves a stale view (startStaleFollow).
  // A stream can also stall silently in the foreground (lost tail, half-dead
  // connection): reader.read() never resolves and no error ever fires, so the
  // page would wait forever on progress (N) + thinking. The watchdog below moves
  // such a stall to the same history-follow path as transport loss.
  let turnStarted = false;
  let turnError = false;
  let finishFollow = false;
  // A turn can be quiet for a long time (a slow tool call, a long provider
  // pause) while the connection stays perfectly healthy. The keep-alive
  // comment the server sends every 15s proves the transport is alive, so it
  // re-arms the transport watchdog, but it is not progress: a turn that
  // produces nothing at all for this long is the stuck one.
  const STREAM_SILENCE_MS = 300000;
  let stallTimer = null;
  let silenceTimer = null;
  const armStall = () => {
    clearTimeout(stallTimer);
    stallTimer = setTimeout(() => { stalled = true; try { if (reader) reader.cancel(); } catch (_) {} }, LIVE_STALL_MS);
  };
  const armProgress = () => {
    clearTimeout(silenceTimer);
    silenceTimer = setTimeout(() => { stalled = true; try { if (reader) reader.cancel(); } catch (_) {} }, STREAM_SILENCE_MS);
  };
  // Set when this feed died while its turn was still running. The turn keeps
  // going on the server, and the server kept its event stream, so the page
  // reattaches to that stream instead of waiting for the turn to end.
  let wentStale = false;
  const goStale = (msg) => {
    staleSession = sessionId;
    staleBox = box;
    staleTries = 0;
    // Until the first fetch below, staleDone still describes the transcript
    // from before this turn and would end the follow on its first tick.
    staleDone = false;
    fail(msg);
    startStaleFollow();
    wentStale = true;
  };
  // The request itself may take time; show Connecting before awaiting headers.
  flushPaint();
  try {
    const res = await fetch(store.base + "/sessions/" + sessionId + "/turns/stream", {
      method: "POST", headers: headers(true), body: JSON.stringify(body),
    });
    if (!res.ok) {
      let detail = res.statusText;
      try { detail = (await res.json()).error || detail; } catch (_) {}
      throw new Error(res.status + " " + detail);
    }
    consumeSkillPick(skillSelection); // Accepted by the server, not model completion.
    turnStarted = true;
    reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    armStall(); // the first block must arrive within LIVE_STALL_MS
    armProgress(); // and the turn must produce something within STREAM_SILENCE_MS
    let finished = false;
    setPhase("Waiting for model…");
    for (;;) {
      const { done, value } = await reader.read();
      if (value) {
        liveEntry.lastEventAt = Date.now();
        buf += dec.decode(value, { stream: true });
      }
      // Consume complete blocks; the tail may hold a partial block.
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const { kind, payload } = parseBlock(buf.slice(0, idx));
        buf = buf.slice(idx + 2);
        // Any block at all, a keep-alive comment included, proves that the
        // connection is still there. Only a real event counts as progress.
        armStall();
        if (kind !== "" || payload) armProgress();
        if (kind === "done") {
          closeThinkingPhase();
          activity.finish("ended");
          activityDirty = false;
          if (sid === sessionId) confirmPollSeq++;
          mutateTranscript(() => phaseBubble.remove());
          if (!answerDirty && bubble) mutateTranscript(() => {
            bubble.classList.remove("pending");
            if (!raw) bubble.textContent = "";
          });
          finished = true;
          break;
        }
        else if (kind === "error") { turnError = true; throw new Error(JSON.parse(payload).error || "turn failed"); }
        else if (kind === "delta") {
          closeThinkingPhase();
          ensureAnswerBubble();
          try { raw += JSON.parse(payload).delta || ""; }
          catch (_) { raw += payload; }
          answerDirty = true;
          setPhase("Responding…");
        }
        else if (kind === "replace") {
          closeThinkingPhase();
          ensureAnswerBubble();
          try { raw = JSON.parse(payload).text || ""; }
          catch (_) { raw = payload; }
          answerDirty = true;
          setPhase(raw ? "Responding…" : "Processing…");
        }
        else if (kind === "answer_pending") {
          // Buffered prose may precede more tool calls; it is not a final reply.
          setPhase("Processing response…");
        }
        else if (kind === "thinking_start") {
          closeThinkingPhase();
          sealAnswerSegment();
          setPhase("Waiting for model…");
        }
        else if (kind === "thinking") {
          try {
            const text = JSON.parse(payload).text || "";
            if (text) {
              setPhase("Thinking…");
              sealAnswerSegment();
              if (!think) mutateTranscript(() => {
                think = createThinkingFold(box, phaseBubble);
                thinkingFolds.push(think);
              });
              thinkRaw += text;
              thinkingDirty = true;
              schedulePaint();
            }
          } catch (_) {}
        }
        else if (kind === "thinking_done") {
          closeThinkingPhase();
          setPhase("Processing…");
        }
        else if (kind === "tool") {
          try {
            const event = JSON.parse(payload);
            closeThinkingPhase();
            sealAnswerSegment();
            mutateTranscript(() => activity.tool(event));
            activityDirty = true;
            schedulePaint();
          } catch (_) {}
        }
        else if (kind === "subagent_progress") {
          mutateTranscript(() => activity.subagents(payload));
          activityDirty = true;
          schedulePaint();
        }
        else if (kind === "confirm_request") {
          setPhase("Waiting for confirmation…", true);
          // Server text: showConfirm renders the prompt through textContent.
          // Only the session on screen can answer: the dialog answers into
          // `sessionId`, so a question from a turn in another session is left
          // pending on the server (the dialog shows when that session is
          // opened, because pollConfirm rebuilds it from /confirm).
          try { const c = JSON.parse(payload); if (sid === sessionId) showConfirm(c.id, c.prompt, c.token, c.input); } catch (_) {}
        }
        else if (kind === "confirm_done") {
          setPhase("Processing…");
          // Only the question this event closes goes away; a newer request can
          // only follow it, and an id-less event hides whatever is on screen.
          let cid = null;
          try { cid = JSON.parse(payload).id; } catch (_) {}
          if (sid === sessionId && (cid === null || (confirmShown && confirmShown.id === cid))) hideConfirm();
        }
        else if (kind === "input_request") {
          let c = null;
          try { c = JSON.parse(payload); } catch (_) {}
          if (c && typeof c.prompt === "string" && c.prompt.startsWith(NATIVE_PREFIX)) {
            // A phone action is executed by the app, not typed into a dialog.
            if (sid === sessionId) {
              setPhase("正在手机上执行…", true);
              void handleNativeRequest(c.id, c.token, c.prompt);
            }
          } else {
            setPhase("Waiting for your input…", true);
            if (c && sid === sessionId) showConfirm(c.id, c.prompt, c.token, true);
          }
        }
        else if (kind === "input_done") {
          setPhase("Processing…");
          let cid = null;
          try { cid = JSON.parse(payload).id; } catch (_) {}
          if (sid === sessionId && (cid === null || (confirmShown && confirmShown.id === cid))) hideConfirm();
        }
        else if (payload) {
          ensureProgressPhase();
          progLines.push(payload);
          progressDirty = true;
          schedulePaint();
        }
      }
      if (finished) break;
      if (done) break;
    }
    clearTimeout(stallTimer);
    clearTimeout(silenceTimer);
    flushPaint(); // flush the tail before final decoration or stale recovery
    finishFollow = sid === sessionId && shouldFollowOutput();
    if (bubble && raw.trim()) bubble.innerHTML = renderMarkdown(raw); // previews belong to the finished reply
    if (bubble) decorateAndLoad(bubble); // reply paths become previews only once it is final
    if (!finished && !turnError) {
      // Only the session on screen can be followed from history here; a stalled
      // turn in a session the user has left is retired, and its reply is what
      // that session renders when it is opened again.
      const reason = recoverReason || (stalled ? "stream stalled (no progress for 5 minutes)" : "stream ended before completion");
      if (sid === sessionId) goStale(reason + " — checking server history");
      else dropBackgroundTurn(box, reason);
    }
    else if (bubble && !raw.trim()) {
      // A turn that ended on a tool round can leave an empty trailing bubble
      // after earlier prose segments were sealed: drop it instead of labelling
      // the whole reply empty.
      if (answerBubbles.length > 1) bubble.remove();
      else { bubble.hidden = false; bubble.innerHTML = "<span style='color:var(--dim)'>(empty reply)</span>"; }
    }
  } catch (e) {
    clearTimeout(stallTimer);
    clearTimeout(silenceTimer);
    flushPaint();
    if (bubble && raw.trim()) bubble.innerHTML = renderMarkdown(raw);
    if (bubble) decorateAndLoad(bubble); // the formulas are typeset once, when the reply is final
    finishFollow = sid === sessionId && shouldFollowOutput();
    if (turnStarted && !turnError) {
      // The POST was accepted and no server `error` event arrived, so this is
      // transport loss: the turn keeps running server-side and the view is
      // stale. Follow the transcript instead of declaring the turn dead — for
      // the session on screen only: a turn the user has left keeps running
      // unheard, and that session follows it from history when it comes back.
      if (sid === sessionId) goStale("connection lost: " + e.message + " — the turn keeps running on the server (following history)");
      else dropBackgroundTurn(box, "connection lost");
    } else fail("turn failed: " + e.message);
  }
  // This turn is over, so its session may send again: the entry goes away
  // whether or not the box stays on screen.
  clearInterval(phaseTimer);
  turns.delete(sid);
  // The server persisted this input before it ran the turn, so history keeps
  // it even if the page's message count drifted.
  if (turnStarted) userInput.settled = true;
  if (wentStale && sid === sessionId) {
    // The live feed died but its turn is still running on the server, and the
    // server kept that turn's event stream: reattach to it so the reply keeps
    // streaming (with its thinking and its partial answer) instead of leaving
    // the transcript empty until the turn ends. The history follow stays armed
    // as the fallback: it idles while the reattached stream is live.
    box.remove();
    // A turn the server already reports as over has nothing left to reattach;
    // the history follow above is enough and avoids rebuilding an ended turn.
    if (!recoverEnded) void attachEvents();
  }
  // The feed that just ended owns the truth about the turn it carried, same
  // as at stream start: the live-stream leg drops with the map entry above,
  // and a `turnRunning` sample taken mid-turn (screen locked, app switched)
  // must not outlive the `done` that proved the turn over. No
  // delayed poll follows on purpose: past `done`, server `running=true` can
  // only be reap lag (the child is reaped after OutputComplete) or a new
  // remote turn, and one boolean cannot tell them apart — latching it nailed
  // the button red for up to RUNNING_SAMPLE_TTL_MS. Event polls (return,
  // stale ticks, boot) re-derive the truth when there is something to see.
  // ... only for the session this feed belongs to: a sample that describes the
  // session on screen (some other session's turn) is not this stream's to clear.
  if (sid === sessionId) turnRunning = false;
  syncStopButton();
  // A box for a turn that finished while the user was elsewhere is dropped:
  // that session's transcript is rebuilt from history when it is opened, which
  // is where the finished reply lives. A box on screen stays, so the trace and
  // the reply remain readable without a reload.
  if (sid !== sessionId) box.remove();
  else followOutput(finishFollow);
  loadInfo();
  loadSessions();
}

// Length only, never the secret: separates "nothing stored" (0 chars, save
// never landed) from "stored but wrong" without leaking the token on screen.
function showStored() {
  const el = $("connstat");
  let msg;
  try {
    msg = "stored token: " + (localStorage.getItem("serve.token") || "").length + " chars";
  } catch (e) {
    msg = "stored token: unreadable (" + (e && e.message ? e.message : e) + ")";
  }
  el.textContent = msg;
  el.classList.add("show");
}
// Keep only event metadata in memory; never record text, keys, tokens or URLs.
function createInputTrace(prompt) {
  const events = [];

      if (type === "compositionstart" || type === "compositionupdate" || type === "compositionend") counters.composition++;
      if (type === "input" && event.inputType === "insertCompositionText") counters.compositionInput++;
      if (type === "input" && event.inputType === "insertText") counters.directInput++;
      events.push({ ms: Date.now() - started, event: type,
        composing: !!event.isComposing, inputType: event.inputType || "",
        focused: document.activeElement === prompt, length: prompt.value.length,
        viewportHeight: window.innerHeight, cssHeight: prompt.style.height });
      if (events.length > 300) events.shift();

    clear() {
      events.length = 0;
      counters.composition = counters.compositionInput = counters.directInput = 0;
    },
    export() {

      // language or native InputConnection state. Report observations only.
      const hint = counters.composition === 0 && counters.directInput > 0
        ? "no DOM composition events observed; insertText alone does not identify the input language or keyboard mode"
        : "";
      return JSON.stringify({
        version: 2,
        userAgent: navigator.userAgent,
        ime: {
          compositionEvents: counters.composition,
          compositionInputs: counters.compositionInput,
          directInputs: counters.directInput,
          hint,
        },
        events,

    },
  };
}
// After the app was in the background the keyboard can come back attached to a

  imeRebindArmed = false;
