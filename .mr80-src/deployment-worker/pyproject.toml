[project]
name = "conciliator-deployment-worker"
version = "0.1.0"
description = "Standalone Devbox deployment worker for Conciliator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27.0"]
classifiers = ["Operating System :: POSIX :: Linux"]

[project.scripts]
conciliator-deployment-worker = "conciliator_deployment_worker.worker:cli"

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conciliator_deployment_worker"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/README.md", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC"]
