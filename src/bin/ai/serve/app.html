<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="a serve">
<link rel="manifest" href="/app.webmanifest">
<link rel="icon" href="/app-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/app-icon-192.png" sizes="192x192">
<title>a serve</title>
<style>
:root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --line:#30363d; --fg:#e6edf3; --dim:#8b949e; --acc:#2f81f7; --ok:#3fb950; --err:#f85149; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; display:flex; flex-direction:column; height:100dvh; }
header { display:flex; align-items:center; gap:8px; padding:10px 12px; background:var(--panel); border-bottom:1px solid var(--line); }
header b { font-size:15px; }
#info { font-size:12px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
#apkdownload { display:none; }
#apkdownload svg { width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
button, select, input, textarea { font:inherit; color:var(--fg); background:#0d1117; border:1px solid var(--line); border-radius:8px; }
button { padding:7px 12px; background:#21262d; cursor:pointer; touch-action:manipulation; }
button:disabled { opacity:.5; cursor:default; }
button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
/* While a turn runs the same button becomes the stop button; the stop state
   reuses --err the way .primary reuses --acc, and leaves the idle look alone. */
button.stop { background:var(--err); border-color:var(--err); color:#fff; }
#views { flex:1; display:flex; min-height:0; position:relative; }
#sessions { width:min(78vw,300px); border-right:1px solid var(--line); background:var(--panel); display:none; flex-direction:column; }
#sessions.open { display:flex; }
#sessions ul { list-style:none; margin:0; padding:8px; overflow-y:auto; flex:1; }
#sessions li { padding:8px; border-radius:8px; font-size:14px; }
#sessions li.cur { background:#1f6feb33; }
#sessions li.holding { background:#1f6feb55; }
#sessions li small { color:var(--dim); display:block; font-size:12px; }
#sessions li .rn { float:right; background:none; border:none; color:var(--dim); font-size:14px; padding:4px 10px; cursor:pointer; }
#sessions li .rnm { width:100%; font-size:inherit; box-sizing:border-box; }
#sessfilter { margin:8px 8px 0; padding:6px 8px; font-size:13px; width:calc(100% - 16px); box-sizing:border-box; }
#sesscount { padding:4px 12px 0; color:var(--dim); font-size:12px; }
#scrim { display:none; }
/* Desktop renders the override row exactly as before: the wrapper is
   transparent and its summary hidden (the phone query below undoes both). */
#ovrwrap { display:contents; }
#ovrwrap > summary { display:none; }
html { -webkit-text-size-adjust:100%; }
select, summary { touch-action:manipulation; }
.msg details summary { padding:10px 4px; cursor:pointer; }
/* 16px form text stops iOS Safari auto-zooming into focused fields;
   padding keeps the visual size small. */
#ovr select, #conn input, #sessfilter { font-size:16px; }
/* The token-length line is diagnostics: show it only while the conn panel
   is open instead of spending a permanent row on it. */
#conn:not(.open) + #connstat { display:none; }
#chat { flex:1; display:flex; flex-direction:column; min-width:0; }
#msgwrap { flex:1; min-height:0; position:relative; }
#msgs { height:100%; box-sizing:border-box; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px; overscroll-behavior-y:contain; }
#turnstatus { padding:6px 12px; font-size:12px; color:var(--dim); border-top:1px solid var(--line); }
.turn { display:flex; flex-direction:column; gap:8px; min-width:0; }
.turn .tool-activity summary { color:var(--fg); }
.turn .tool-activity[data-running="true"] { border-color:#426b94; }
#jumpbottom {
  display:none; position:absolute; right:16px; bottom:14px; z-index:3;
  width:46px; height:46px; padding:0; place-items:center; border-radius:50%;
  border:1px solid rgba(255,255,255,.28); background:rgba(31,111,235,.96); color:#fff;
  box-shadow:0 8px 24px rgba(0,0,0,.38), 0 2px 6px rgba(31,111,235,.28);
  opacity:0; transform:translateY(8px) scale(.92); pointer-events:none;
  transition:opacity .18s ease, transform .18s ease, box-shadow .18s ease;
}
#jumpbottom svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
#jumpbottom:active { transform:translateY(1px) scale(.96); box-shadow:0 4px 14px rgba(0,0,0,.34); }
#questionbtn {
  display:none; position:relative; flex:0 0 auto; width:38px; min-width:38px; height:34px;
  padding:0; place-items:center; border-radius:10px; color:var(--dim); background:#21262d;
}
#questionbtn svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; }
#questionbtn .count {
  position:absolute; top:-6px; right:-6px; min-width:18px; padding:1px 4px; border-radius:999px;
  background:#1f6feb; color:#fff; font-size:10px; line-height:16px;
}
#questionpanel {
  display:none; position:absolute; inset:10px 10px 8px; z-index:4; flex-direction:column;
  min-height:0; overflow:hidden; border:1px solid var(--line); border-radius:16px;
  background:rgba(22,27,34,.98); box-shadow:0 16px 48px rgba(0,0,0,.55);
}
#questionpanel.open { display:flex; }
#questionhead { display:flex; align-items:center; gap:8px; padding:12px; border-bottom:1px solid var(--line); }
#questionhead strong { flex:1; }
#questionclose { min-width:38px; min-height:38px; padding:0; border-radius:50%; }
#questionlist { min-height:0; overflow-y:auto; padding:8px; }
#questionlist .empty { padding:24px 12px; color:var(--dim); text-align:center; }
.question-link { display:flex; width:100%; margin:0 0 6px; padding:10px; gap:10px; text-align:left; background:#0d1117; }
.question-link .num { flex:0 0 auto; color:#79c0ff; font-size:12px; }
.question-link .text { min-width:0; overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; white-space:normal; }
.msg.question-target { animation:question-target 1.6s ease-out; }
@keyframes question-target { 0%,30% { box-shadow:0 0 0 4px rgba(88,166,255,.75); } 100% { box-shadow:none; } }
.msg { max-width:92%; padding:8px 12px; border-radius:12px; white-space:pre-wrap; word-break:break-word; font-size:15px; }
.msg.pending { color:var(--dim); font-style:italic; }
.msg.user { align-self:flex-end; background:#1f6feb; color:#fff; }
.msg.asst { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
.msg details { font-size:13px; color:var(--dim); }
/* Desktop keeps the compact whole-bubble shortcut; phones use the explicit
   action below so a normal transcript tap cannot destroy history. */
.msg.rewindable { cursor:pointer; }
.user-msg-row { display:contents; }
.rewind-action { display:none; }
#sidenote { display:none; }
.msg .prog { font-size:13px; color:var(--dim); }
.msg.err { border-color:var(--err); color:var(--err); }
#ovr { display:flex; gap:6px; padding:8px 12px 0; }
#ovr select { flex:1; min-width:0; font-size:13px; padding:6px 8px; }
#skillpicker { position:relative; flex:1; min-width:0; }
#skillfield { position:relative; }
#oskill { width:100%; padding:6px 36px 6px 8px; font-size:16px; }
#oskill:focus { outline:2px solid #388bfd; outline-offset:1px; }
#skillclear { position:absolute; right:1px; top:1px; bottom:1px; width:34px; padding:0; background:transparent; border:0; color:var(--dim); }
#skillmenu { position:absolute; bottom:calc(100% + 8px); left:0; right:0; z-index:12; max-height:min(240px,35dvh); overflow-y:auto; overscroll-behavior:contain; touch-action:pan-y; padding:5px; background:var(--panel); border:1px solid #426b94; border-radius:12px; box-shadow:0 8px 24px #0008; }
#skillmenu [role="option"] { padding:10px; min-height:44px; border-radius:8px; cursor:pointer; overflow-wrap:anywhere; }
#skillmenu [aria-selected="true"], #skillmenu [role="option"]:hover { background:#1f6feb33; }
#skillmenu small { display:block; color:var(--dim); font-size:12px; }
#skillhint { padding:5px 8px; color:var(--dim); font-size:12px; }
#composer { display:flex; gap:8px; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:var(--panel); border-top:1px solid var(--line); }
#prompt {
  flex:1; min-height:44px; max-height:30dvh; padding:9px 10px; resize:none;
  -webkit-user-select:text; user-select:text; -webkit-touch-callout:default;
}
#conn { display:none; gap:6px; padding:8px 12px; background:var(--panel); border-top:1px solid var(--line); }
#conn.open { display:flex; }
#conn:not(.open) ~ #inputtrace { display:none; }
#conn input { flex:1; min-width:0; font-size:13px; padding:6px 8px; }
#connstat { display:none; padding:2px 12px 6px; font-size:12px; color:var(--dim); background:var(--panel); }
#connstat.show { display:block; }
/* Transient status notes (stop turn) must read with the conn panel closed,
   unlike the diagnostics line above, so this beats the sibling
   `#conn:not(.open) + #connstat` rule that hides it. */
#connstat.note { display:block !important; }
.rowbtns { display:flex; gap:6px; padding:6px 8px; }
.rowbtns button { font-size:12px; padding:4px 8px; }
#sessbar { display:flex; align-items:baseline; gap:8px; padding:6px 12px; background:var(--panel); border-bottom:1px solid var(--line); font-size:13px; cursor:pointer; }
#sesstitle { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
#sessmeta { color:var(--dim); font-size:12px; white-space:nowrap; }
/* Rendered markdown for assistant replies (.md): block layout instead of the
   pre-wrap source view the other bubbles keep. */
.msg.md { white-space:normal; }
.msg.md .p { margin:3px 0; }
.msg.md .h { font-weight:700; margin:6px 0 2px; }
.msg.md .h.lv1 { font-size:19px; }
.msg.md .h.lv2 { font-size:17px; }
.msg.md .h.lv3 { font-size:16px; }
.msg.md .h.lv4, .msg.md .h.lv5, .msg.md .h.lv6 { font-size:15px; }
.msg.md .li { display:flex; gap:6px; margin:3px 0; }
.msg.md .li > .bullet { flex:0 0 auto; color:var(--dim); min-width:14px; }
/* A flex item refuses to shrink below its min-content width by default, so one
   unbreakable inline code token would push the bubble past the phone viewport.
   min-width:0 lets it shrink; anywhere lets the token itself wrap. */
.msg.md .li > span:not(.bullet) { min-width:0; overflow-wrap:anywhere; }
.msg.md blockquote { margin:4px 0; padding:2px 0 2px 8px; border-left:3px solid var(--line); color:var(--dim); }
.msg.md hr { border:0; border-top:1px solid var(--line); margin:8px 0; }
.msg.md a { color:var(--acc); }
.msg.md .media-image, .msg.md .media-video, .msg.md .media-audio { display:block; margin:8px 0; }
.msg.md .media-image img, .msg.md .media-video video { display:block; width:auto; max-width:100%; max-height:min(70dvh,720px); border:1px solid var(--line); border-radius:8px; background:#080b10; }
.msg.md .media-video video { width:100%; aspect-ratio:16/9; }
.msg.md .media-audio audio { display:block; width:100%; }
.msg.md .media-caption { display:block; margin-top:4px; overflow-wrap:anywhere; font-size:12px; color:var(--dim); }
.msg.md .svg-preview { display:block; width:100%; max-width:720px; margin:8px 0; }
.msg.md .svg-preview-toolbar { display:flex; justify-content:flex-end; gap:4px; margin-bottom:5px; }
.msg.md .svg-preview-toolbar button { min-height:30px; padding:4px 9px; border:1px solid var(--line); border-radius:999px; background:#161b22; color:var(--dim); font-size:12px; }
.msg.md .svg-preview-toolbar button[aria-pressed="true"] { border-color:var(--acc); background:rgba(31,111,235,.16); color:var(--fg); }
.msg.md .svg-preview iframe { display:block; width:100%; max-height:min(70dvh,720px); border:1px solid var(--line); border-radius:8px; background:#fff; }
.msg.md .svg-preview-source { display:none; max-height:min(70dvh,720px); margin:0; white-space:pre; overflow:auto; }
.msg.md .svg-preview.show-source iframe { display:none; }
.msg.md .svg-preview.show-source .svg-preview-source { display:block; }
.msg.md code { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:13px;
  background:#0d1117; border:1px solid var(--line); border-radius:5px; padding:0 4px; overflow-wrap:anywhere; }
.msg.md pre { margin:6px 0; padding:8px; background:#0d1117; border:1px solid var(--line);
  border-radius:8px; overflow-x:auto; }
/* Wrap code instead of scrolling it: a phone cannot hover, and a horizontal
   scroll region hides the tail of a line behind an easy-to-miss gesture. */
.msg.md pre code { background:none; border:0; padding:0; white-space:pre-wrap; overflow-wrap:anywhere; }
.msg.md .tablewrap { overflow-x:auto; margin:6px 0; }
/* Keep wide equations scrollable inside the bubble, including flex list items. */
.msg.md .li > span:last-child { min-width:0; }
.msg.md .math { max-width:100%; overflow-x:auto; overflow-y:hidden; word-break:normal; }
.msg.md .math.display { display:block; margin:8px 0; padding:4px 0; }
.msg.md .math.inline { display:inline-block; vertical-align:middle; }
.msg.md .math .katex-display { margin:0; text-align:left; }
.msg.md .math .katex-display > .katex { text-align:left; }
.msg.md table { border-collapse:collapse; font-size:13px; }
.msg.md th, .msg.md td { border:1px solid var(--line); padding:2px 6px; text-align:left; }
/* A turn can stop and ask before doing something (a tool that needs an
   explicit yes). The question is modal on purpose: the turn stays blocked
   until it is answered, and this dialog is the only way to answer it. */
#confirmwrap { position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center; padding:16px; background:rgba(0,0,0,.55); }
#confirmwrap.open { display:flex; }
#confirmbox { width:100%; max-width:440px; max-height:80dvh; overflow-y:auto; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:10px; box-shadow:0 12px 32px rgba(0,0,0,.6); }
#confirmtitle { font-size:12px; color:var(--dim); }
#confirmtext { white-space:pre-wrap; word-break:break-word; overflow-wrap:anywhere; font-size:15px; }
#confirminputrow { display:none; }
#confirminputrow.show { display:block; }
#confirminput { width:100%; box-sizing:border-box; min-height:44px; padding:8px 10px; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:8px; font:inherit; }
#confirmerr { display:none; color:var(--err); font-size:13px; }
#confirmerr.show { display:block; }
#confirmbtns { display:flex; gap:8px; }
#confirmbtns button { flex:1; min-height:44px; }
/* ---- phone layout (narrow viewports only; desktop is untouched) ---------- */
@media (max-width:700px) {
  header button { min-width:44px; min-height:44px; }
  #apkdownload {
    display:grid; flex:0 0 44px; width:44px; height:44px; place-items:center;
    border:1px solid #3a424d; border-radius:10px; background:#21262d;
    color:#79c0ff; text-decoration:none; touch-action:manipulation;
  }
  #apkdownload:active { background:#30363d; transform:translateY(1px); }
  /* The drawer floats over the chat instead of squeezing it; tapping the
     dimmed remainder (the scrim) closes it. */
  #sessions { position:absolute; top:0; bottom:0; left:0; z-index:10; width:min(86vw,320px); box-shadow:8px 0 24px rgba(0,0,0,.55); }
  #scrim.on { display:block; position:absolute; inset:0; z-index:5; background:rgba(0,0,0,.45); }
  #sessions li { padding:12px 10px; font-size:15px; touch-action:pan-y; -webkit-user-select:none; user-select:none; }
  #sessions li .rnm { -webkit-user-select:text; user-select:text; }
  .rowbtns button { flex:1; min-height:42px; font-size:13px; }
  #sessfilter { padding:10px 8px; }
  /* Override picks collapse into one summary row showing the current picks. */
  #ovrwrap { display:block; border-top:1px solid var(--line); }
  #ovrwrap > summary { display:block; padding:8px 12px; font-size:12px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #ovr { flex-direction:column; padding:8px 12px 10px; }
  #ovr select { width:100%; padding:10px 8px; }
  #oskill { min-height:44px; padding:10px 44px 10px 8px; }
  #skillclear { width:42px; }
  #msgs { padding:10px; }
  #jumpbottom { display:grid; }
  #jumpbottom.show { opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
  #questionbtn.show { display:grid; }
  .msg { max-width:94%; }
  .user-msg-row {
    display:flex; align-items:center; align-self:flex-end; justify-content:flex-end;
    max-width:94%; gap:7px;
  }
  .user-msg-row > .msg.rewindable { min-width:0; max-width:none; align-self:auto; cursor:default; }
  .user-msg-row > .rewind-action {
    display:inline-flex; flex:0 0 auto; align-items:center; justify-content:center;
    width:34px; min-width:34px; height:34px; padding:0; border:1px solid rgba(88,166,255,.48);
    border-radius:999px; background:rgba(22,27,34,.92); color:#b6d8ff;
    box-shadow:0 3px 10px rgba(0,0,0,.22); font-size:19px; line-height:1;
    touch-action:manipulation;
  }
  .msg.md .math.display { margin:4px 0; padding:0; }
  .msg.md .svg-preview-toolbar button { min-height:40px; padding:6px 12px; }
  #composer {
    display:grid; grid-template-columns:42px minmax(0,1fr) 42px;
    grid-template-areas:"image prompt send";
    align-items:end; gap:8px; margin:6px 8px; padding:8px 8px calc(8px + env(safe-area-inset-bottom));
    border:1px solid var(--line); border-radius:18px;
    background:linear-gradient(180deg, #1b2129 0%, #151a21 100%);
    box-shadow:0 8px 24px rgba(0,0,0,.26);
  }
  #composer.side-note-ready {
    grid-template-columns:42px minmax(0,1fr) 58px 42px;
    grid-template-areas:"image prompt sidenote send";
  }
  #composer:focus-within { border-color:#388bfd; box-shadow:0 0 0 2px rgba(56,139,253,.18), 0 8px 24px rgba(0,0,0,.26); }
  #prompt {
    grid-area:prompt; width:100%; min-height:40px; max-height:38dvh;
    box-sizing:border-box; padding:7px 4px 5px; border:0; border-radius:12px;
    background:transparent; box-shadow:none; outline:none;
    font-size:16px; line-height:1.5;
  }
  #img, #send {
    width:42px; min-width:42px; height:42px; min-height:42px; padding:0;
    align-self:end; border-radius:50%; font-size:17px;
  }
  #img { grid-area:image; font-size:0; background:#262d36; border-color:#3a424d; }
  #img::before { content:"+"; font-size:24px; font-weight:300; line-height:1; }
  #sidenote.show {
    grid-area:sidenote; display:inline-flex; align-items:center; justify-content:center;
    align-self:end; height:42px; padding:0 8px; gap:4px; border-radius:999px;
    border-color:rgba(88,166,255,.5); background:rgba(31,111,235,.13);
    color:#b6d8ff; font-size:11px; line-height:1;
  }
  #sidenote svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  #send { grid-area:send; justify-self:end; box-shadow:0 4px 14px rgba(31,111,235,.34); }
  #conn.open { flex-wrap:wrap; }
  #conn.open input { flex:1 1 100%; padding:10px 8px; }
  #conn.open #save { flex:1; min-height:44px; }
}
@media (prefers-reduced-motion:reduce) { #jumpbottom, #prompt { transition:none; } }
/* Server-side images in a reply: the path text stays, the fetched picture
   sits under it (see decorateMedia in the script below). */
.mediaprev { display:block; margin:6px 0; }
.mediaprev.loaded { padding:6px; border:1px solid var(--line); border-radius:8px; }
.mediaprev img { display:block; max-width:100%; max-height:52vh; border-radius:6px; }
.mediaprev audio { display:block; width:100%; }
.mediaprev .mediacap { display:block; margin-top:4px; font-size:11px; color:var(--dim); word-break:break-all; }
#viewer { display:none; position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.92); align-items:center; justify-content:center; }
#viewer.on { display:flex; }
#viewer img { max-width:100vw; max-height:100vh; }
</style>
</head>
<body id="serve-app">
<header>
<button id="menu" aria-label="sessions">☰</button>
<b>a</b><span id="info">connecting…</span>
<a id="apkdownload" href="/a-serve-v1.8.0.apk" download="a-serve-v1.8.0.apk" aria-label="download Android app" title="download Android app"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg></a>
<button id="connbtn" aria-label="connection">⚙</button>
<button id="newbtn" class="primary">＋</button>
</header>
<div id="sessbar" title="sessions"><span id="sesstitle">no session</span><span id="sessmeta"></span><button id="questionbtn" type="button" aria-label="show my questions" aria-expanded="false" title="show my questions"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg><span id="questioncount" class="count">0</span></button></div>
<div id="conn">
<input id="base" placeholder="server, e.g. http://192.168.1.5:8080 (empty = this page)">
<input id="token" type="password" placeholder="bearer token (ai.serve.token)" style="flex:1">
<button id="save">save</button>
<button id="inputdiagnostics" type="button" title="Show local input event timings, without typed text">input diagnostics</button>

function handleReplayEvent(sid, kind, payload, view) {
  if (sid !== sessionId) return;
  if (kind === "thinking") {
    try { const text = JSON.parse(payload).text || ""; if (text) view.thinkingText(text); } catch (_) {}
  } else if (kind === "thinking_done") {
    view.endThinking();
    view.phase("Processing…");
  } else if (kind === "tool") {
    try { view.tool(JSON.parse(payload)); } catch (_) {}
  } else if (kind === "subagent_progress") {
    view.subagents(payload);
  } else if (kind === "delta") {
    try { view.delta(JSON.parse(payload).delta || ""); } catch (_) {}
  } else if (kind === "answer_pending") {
    view.phase("Processing response…");
  } else if (kind === "confirm_request") {
    view.phase("Waiting for confirmation…", true);
    try {
      const c = JSON.parse(payload);
      showConfirm(c.id, c.prompt, c.token, c.input);
    } catch (_) {}
  } else if (kind === "input_request") {
    let c = null;
    try { c = JSON.parse(payload); } catch (_) {}
    if (c && typeof c.prompt === "string" && c.prompt.startsWith(NATIVE_PREFIX)) {
      view.phase("正在手机上执行…", true);
      void handleNativeRequest(c.id, c.token, c.prompt);

// Reattach to the running turn's retained event stream. This is the primary
// path after a reload: it replays progress and delivers a pending native or
// confirmation request without waiting for a poll interval.
async function attachEvents() {
  if (!sessionId || eventActive || turns.has(sessionId)) return;
  const sid = sessionId;
  const controller = new AbortController();
  eventAbort = controller;
  eventActive = true;
  eventSession = sid;
  syncStopButton();
  stopConfirmPoll();
  const view = recoveredProgressView();
  recoveredView = view;
  let buf = "";
  let finished = false;
  try {
    // This connection builds a fresh view; a cursor from a discarded view
    // would skip the very events needed to reconstruct its state.
    const eventsUrl = store.base + "/sessions/" + sid + "/events?after=0";
    const res = await fetch(eventsUrl, {
      headers: headers(false), signal: controller.signal,
    });
    if (!res.ok || !res.body) throw new Error("event stream " + res.status);
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    for (;;) {
      const { done, value } = await reader.read();
      if (value) buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const block = parseBlock(buf.slice(0, idx));
        buf = buf.slice(idx + 2);
        if (block.kind === "done") { finished = true; break; }
        if (block.kind) handleReplayEvent(sid, block.kind, block.payload, view);
      }
      if (finished || done) break;
    }
  } catch (error) {
    if (!controller.signal.aborted && sid === sessionId && !String(error.message).includes("404")) {
      addMsg("err", "live progress unavailable: " + error.message, "asst err");
    }
  } finally {
    view.remove();
    if (recoveredView === view) recoveredView = null;
    if (eventAbort === controller) { eventAbort = null; eventActive = false; eventSession = ""; syncStopButton(); }
    const fresh = turnRunning && Date.now() - turnRunningAt < RUNNING_SAMPLE_TTL_MS;
    if (sid === sessionId && !finished && fresh && !controller.signal.aborted) {
      ensureConfirmPoll(); // fallback while the event stream is down
      setTimeout(attachEvents, 2000);
    } else if (sid === sessionId && !controller.signal.aborted) {
      await loadHistory();
    }
  }
}

function abortEvents() {
  if (eventAbort) { eventAbort.abort(); eventAbort = null; }
  eventActive = false;
  eventSession = "";
  if (recoveredView) { recoveredView.remove(); recoveredView = null; }
}

async function pollConfirm() {
  if (!sessionId || confirmBusy) return null;
  const sid = sessionId;
  const epoch = runEpoch;
  let body;
  try { body = await (await api("/sessions/" + sid + "/confirm")).json(); }
  catch (_) { return null; } // transient (hidden mid-flight, server restarting): retry next tick
  // The fetch can outlive what it describes (answered while it was in flight,
  // session switched, newer turn started): re-check before touching anything.
  if (confirmBusy || sid !== sessionId) return null;
  if (epoch !== runEpoch) return null; // a newer turn owns the button and the dialog now
  // The same poll reports a live turn for this session: the server is the only
  // source that survives this page losing the stream. A missing field means an
  // older server, treated as "not running".
  turnRunning = body.running === true;
  if (turnRunning) { turnRunningAt = Date.now(); armHistoryFollow(); ensureConfirmPoll(); void attachEvents(); }
  else if (!turns.has(sessionId) && staleSession !== sessionId) stopConfirmPoll();
  syncStopButton();
  const pending = body.pending;
  if (!pending) { if (confirmShown) hideConfirm(); return turnRunning; }
  if (pending.input && typeof pending.prompt === "string" && pending.prompt.startsWith(NATIVE_PREFIX)) {
    if (confirmShown) hideConfirm();
    void handleNativeRequest(pending.id, pending.token, pending.prompt);
    return turnRunning;
  }

  // at 1 every turn, so an equal id can still be different text.
  if (!confirmShown || confirmShown.token !== pending.token) showConfirm(pending.id, pending.prompt, pending.token, pending.input);

}

// Parse one SSE block the way serve-chat does: `event: <kind>` plus one or
// more `data: <payload>` lines. Blocks without a kind are progress lines.
function parseBlock(raw) {
  let id = "";
  let kind = "";
  const data = [];
  for (const line of raw.split("\n")) {
    if (line.startsWith("id:")) id = line.slice(3).trim();
    else if (line.startsWith("event:")) kind = line.slice(6).trim();
    else if (line.startsWith("data:")) data.push(line.slice(5).trimStart());
    else if (line.trim() === "" || line.startsWith(":")) continue; // blank or SSE keep-alive comment, never progress
    else data.push(line);
  }
  return { id, kind, payload: data.join("\n") };
}

        }
        else if (kind === "error") { turnError = true; throw new Error(JSON.parse(payload).error || "turn failed"); }
        else if (kind === "delta") {
          closeThinkingPhase();
          try { raw += JSON.parse(payload).delta || ""; }
          catch (_) { raw += payload; }
          answerDirty = true;
          schedulePaint();
        }
        else if (kind === "answer_pending" && !raw) {
          // Buffered prose may precede more tool calls; it is not a final reply.
          setPhase("Processing response…");
        }
        else if (kind === "thinking_start") {
          closeThinkingPhase();
          setPhase("Waiting for model…");
        }
        else if (kind === "thinking") {
          try {
            const text = JSON.parse(payload).text || "";
            if (text) {
              setPhase("Thinking…");
              if (!think) mutateTranscript(() => {
                think = createThinkingFold(box, bubble);
                thinkingFolds.push(think);
              });
              thinkRaw += text;
              thinkingDirty = true;
              schedulePaint();
            }
          } catch (_) {}
        }
        else if (kind === "thinking_done") {
          closeThinkingPhase();
          setPhase("Processing…");
        }
        else if (kind === "tool") {
          try {
            const event = JSON.parse(payload);
            closeThinkingPhase();
            mutateTranscript(() => activity.tool(event));
            activityDirty = true;
            schedulePaint();
          } catch (_) {}
        }
        else if (kind === "subagent_progress") {
          mutateTranscript(() => activity.subagents(payload));
        }
        else if (kind === "confirm_request") {
          setPhase("Waiting for confirmation…", true);
          // Server text: showConfirm renders the prompt through textContent.
          // Only the session on screen can answer: the dialog answers into
          // `sessionId`, so a question from a turn in another session is left
          // pending on the server (the dialog shows when that session is
          // opened, because pollConfirm rebuilds it from /confirm).
          try { const c = JSON.parse(payload); if (sid === sessionId) showConfirm(c.id, c.prompt, c.token, c.input); } catch (_) {}
        }
        else if (kind === "confirm_done") {
          setPhase("Processing…");
          // Only the question this event closes goes away; a newer request can
          // only follow it, and an id-less event hides whatever is on screen.
          let cid = null;
          try { cid = JSON.parse(payload).id; } catch (_) {}
          if (sid === sessionId && (cid === null || (confirmShown && confirmShown.id === cid))) hideConfirm();
        }
        else if (kind === "input_request") {
          let c = null;
          try { c = JSON.parse(payload); } catch (_) {}
          if (c && typeof c.prompt === "string" && c.prompt.startsWith(NATIVE_PREFIX)) {
            // A phone action is executed by the app, not typed into a dialog.
            if (sid === sessionId) {
              setPhase("正在手机上执行…", true);
              void handleNativeRequest(c.id, c.token, c.prompt);
            }
          } else {
            setPhase("Waiting for your input…", true);
            if (c && sid === sessionId) showConfirm(c.id, c.prompt, c.token, true);
          }
        }
        else if (kind === "input_done") {
          setPhase("Processing…");
          let cid = null;
          try { cid = JSON.parse(payload).id; } catch (_) {}
          if (sid === sessionId && (cid === null || (confirmShown && confirmShown.id === cid))) hideConfirm();
        }
        else if (payload) {
          ensureProgressPhase();
          progLines.push(payload);
          progressDirty = true;
          schedulePaint();
        }
      }
      if (finished) break;
      if (done) break;
    }
    clearTimeout(stallTimer);
    flushPaint(); // flush the tail before final decoration or stale recovery
    finishFollow = sid === sessionId && shouldFollowOutput();
    decorateAndLoad(bubble); // reply paths become previews only once it is final
    if (!finished && !turnError) {
      // Only the session on screen can be followed from history here; a stalled
      // turn in a session the user has left is retired, and its reply is what
      // that session renders when it is opened again.
      const reason = stalled ? "stream stalled (no updates for 60s)" : "stream ended before completion";
      if (sid === sessionId) goStale(reason + " — checking server history");
      else dropBackgroundTurn(box, reason);
    }
    else if (!raw) bubble.innerHTML = "<span style='color:var(--dim)'>(empty reply)</span>";
  } catch (e) {
    clearTimeout(stallTimer);
    flushPaint();
    finishFollow = sid === sessionId && shouldFollowOutput();
    if (turnStarted && !turnError) {
      // The POST was accepted and no server `error` event arrived, so this is
      // transport loss: the turn keeps running server-side and the view is
      // stale. Follow the transcript instead of declaring the turn dead — for
      // the session on screen only: a turn the user has left keeps running
      // unheard, and that session follows it from history when it comes back.
      if (sid === sessionId) goStale("connection lost: " + e.message + " — the turn keeps running on the server (following history)");
      else dropBackgroundTurn(box, "connection lost");
    } else fail("turn failed: " + e.message);
  }
  // This turn is over, so its session may send again: the entry goes away
  // whether or not the box stays on screen.
  turns.delete(sid);
  // The feed that just ended owns the truth about the turn it carried, same
  // as at stream start: the live-stream leg drops with the map entry above,
  // and a `turnRunning` sample taken mid-turn (screen locked, app switched)
  // must not outlive the `done` that proved the turn over. No
  // delayed poll follows on purpose: past `done`, server `running=true` can
  // only be reap lag (the child is reaped after OutputComplete) or a new
  // remote turn, and one boolean cannot tell them apart — latching it nailed
  // the button red for up to RUNNING_SAMPLE_TTL_MS. Event polls (return,
  // stale ticks, boot) re-derive the truth when there is something to see.
  // ... only for the session this feed belongs to: a sample that describes the
  // session on screen (some other session's turn) is not this stream's to clear.
  if (sid === sessionId) turnRunning = false;
  syncStopButton();
  // A box for a turn that finished while the user was elsewhere is dropped:
  // that session's transcript is rebuilt from history when it is opened, which
  // is where the finished reply lives. A box on screen stays, so the trace and
  // the reply remain readable without a reload.
  if (sid !== sessionId) box.remove();
  else followOutput(finishFollow);
  loadInfo();
  loadSessions();
}

// Length only, never the secret: separates "nothing stored" (0 chars, save
// never landed) from "stored but wrong" without leaking the token on screen.
function showStored() {
  const el = $("connstat");
  let msg;
  try {
    msg = "stored token: " + (localStorage.getItem("serve.token") || "").length + " chars";
  } catch (e) {
    msg = "stored token: unreadable (" + (e && e.message ? e.message : e) + ")";
  }
  el.textContent = msg;
  el.classList.add("show");
}
// Keep only event metadata in memory; never record text, keys, tokens or URLs.
function createInputTrace(prompt) {
  const events = [];
  const started = Date.now();
  return {
    record(event) {
      events.push({ ms: Date.now() - started, event: event.type,
        composing: !!event.isComposing, inputType: event.inputType || "",
        focused: document.activeElement === prompt, length: prompt.value.length,
        viewportHeight: window.innerHeight, cssHeight: prompt.style.height });
      if (events.length > 80) events.shift();
    },
    export() { return JSON.stringify({ version: 1, userAgent: navigator.userAgent, events }, null, 2); },
  };
}
let uiWired = false;
function wire() {
  // Show what is actually stored: typing alone never reaches localStorage
  // until Save, so prefill both inputs or an empty box misleads into a 401.
  $("base").value = localStorage.getItem("serve.base") || "";
  $("token").value = localStorage.getItem("serve.token") || "";
  showStored();
  syncStopButton();
  if (uiWired) return;
  uiWired = true;
  const inputTrace = createInputTrace($("prompt"));
  for (const type of ["focus", "blur", "compositionstart", "compositionupdate", "compositionend", "beforeinput", "input"]) {
    $("prompt").addEventListener(type, (event) => inputTrace.record(event));
  }
  window.addEventListener("resize", (event) => inputTrace.record(event));
  document.addEventListener("visibilitychange", (event) => inputTrace.record(event));
  $("inputdiagnostics").onclick = () => {
    const output = $("inputtrace");
    output.value = inputTrace.export();
    output.hidden = false;
    output.focus();
    output.select();
  };
  $("send").onclick = () => { if (isTurnRunning()) stopTurn(); else send(); };
  $("sidenote").onclick = sendSideNote;
  // The dialog is the only way to unblock a turn that stopped to ask; both
  // answers post to /sessions/{id}/confirm through answerConfirm.
  $("callow").onclick = () => answerConfirm(true);
  $("cdeny").onclick = () => answerConfirm(false);
  $("msgs").addEventListener("click", handleSvgPreviewClick);
  $("msgs").addEventListener("scroll", scheduleJumpButtonUpdate, { passive: true });
  $("jumpbottom").onclick = () => scrollToLatest(true);
  $("questionbtn").onclick = (event) => { event.stopPropagation(); openQuestionPanel(); };
  $("questionclose").onclick = closeQuestionPanel;
  window.addEventListener("resize", () => {
    updateJumpButton();
    updateQuestionButton();
    const prompt = $("prompt");
    if (!(promptComposing && document.activeElement === prompt)) growPrompt();
  });
  // Android drops a backgrounded page's connections, and a page cannot see that
  // until it is visible again, so coming back is where recovery has to start.
  // A question the turn is blocked on survives a reconnect, so coming back to
  // the page is also where the confirm dialog has to be rebuilt.
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { void pollConfirm().then(checkInterruptedTurn); startStaleFollow(); } });
  window.addEventListener("pageshow", () => { void pollConfirm().then(checkInterruptedTurn); startStaleFollow(); }); // bfcache restore fires no visibility change
  if (window.matchMedia && matchMedia("(max-width: 700px)").matches) $("ovrwrap").open = false;
  $("scrim").onclick = () => setDrawer(false);
  $("omodel").onchange = () => savePick();
  $("oagent").onchange = () => savePick();
  $("oeffort").onchange = () => savePick();
  $("oskill").onfocus = renderSkillMenu;
  $("oskill").onclick = renderSkillMenu;
  $("oskill").onblur = closeSkillMenu;
  $("oskill").oninput = (e) => {
    if (e.isComposing) skillComposing = true;
    skillInputChanged();
  };
  $("oskill").oncompositionstart = () => { skillComposing = true; closeSkillMenu(); };
  $("oskill").oncompositionend = () => { skillComposing = false; skillInputChanged(); };
  $("oskill").onkeydown = skillKeydown;
  $("skillclear").onpointerdown = (e) => e.preventDefault();
  $("skillclear").onclick = () => chooseSkill("");
  $("prompt").addEventListener("compositionstart", () => { promptComposing = true; });
  $("prompt").addEventListener("compositionend", () => {
    promptComposing = false;
    growPrompt();
    persistDraft();
  });
  $("prompt").addEventListener("input", (e) => {
    if (promptComposing || e.isComposing) return;
    growPrompt();
    persistDraft();
  });
  $("prompt").addEventListener("paste", handlePromptPaste);
  restoreDraft();
  $("prompt").addEventListener("keydown", (e) => {
    // Plain Enter inserts a newline (mobile keyboards included); only the
    // send button — or Ctrl/Cmd+Enter for hardware keyboards — submits.
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); }
  });
  const toggleSessions = () => setDrawer(!$("sessions").classList.contains("open"));;
  $("menu").onclick = toggleSessions;
  $("sessbar").onclick = toggleSessions;
  $("sessfilter").oninput = (e) => { sessFilter = e.target.value; renderSessionList(lastItems); };
  $("connbtn").onclick = () => $("conn").classList.toggle("open");
  $("save").onclick = async () => {
    const b = normalizeServeBase($("base").value);
    $("base").value = b;
    // Phones love appending a trailing space via autocomplete; that single
    // char is enough for a 401, so trim and write it back visibly.
    const t = $("token").value.trim();
    $("token").value = t;
    try {
      localStorage.setItem("serve.base", b);
      localStorage.setItem("serve.token", t);
    } catch (e) {
      // Blocked storage (private mode, locked-down WebView) throws here;
      // without this the tap silently does nothing and every call 401s.
      const el = $("connstat");
      el.textContent = "save failed: " + (e && e.message ? e.message : e);
      el.classList.add("show");
      return;
    }
    showStored();
    $("conn").classList.remove("open");
    await boot();
  };
  $("newbtn").onclick = async () => {
    try {
      const newId = (await (await api("/sessions", { method: "POST" })).json()).id;
      switchSession(newId);
      pendingNew = newId;
      lastMsgCount = null;
      turnRunning = false; // fresh id: no turn can be running here (and it 404s a poll)
      // The id is lazy (no history yet): show it optimistically instead of
      // loadHistory, which would 404 and print a scary red error, and let
      // loadSessions refresh only the drawer/bar around the pending id.
      $("msgs").textContent = "";
      addMsg("asst", "new session — type below to start.", "asst");
      await loadSessions();
      loadSessionConfig(); // a fresh session owns no config; clear the picks
    } catch (e) { addMsg("err", "create session failed: " + e.message, "asst err"); }
  };
  $("refresh").onclick = async () => { await loadSessions(); await loadHistory(); };
  $("fork").onclick = async () => {
    if (!sessionId) return;
    try {
      const forkedId = (await (await api("/sessions/" + sessionId + "/fork", { method: "POST" })).json()).id;
      switchSession(forkedId);
      lastMsgCount = null;
      turnRunning = false; // a running turn (if any) belongs to the source session
      await loadSessions(); await loadHistory();
      await loadSessionConfig(); // the fork inherits the source session's picks
    } catch (e) { addMsg("err", "fork failed: " + e.message, "asst err"); }
  };
  $("del").onclick = () => deleteSession(sessionId);
  $("img").onclick = () => $("file").click();
  $("viewer").onclick = () => { $("viewer").classList.remove("on"); $("viewerimg").src = ""; };
  $("file").onchange = async () => {
    await queueImageFiles($("file").files);
    $("file").value = "";
  };
}
function registerAppServiceWorker() {
  if (!("serviceWorker" in navigator) || !window.isSecureContext) return;
  navigator.serviceWorker.register("/app-sw.js", { scope: "/" }).catch((error) => {
    console.warn("service worker registration failed", error);
  });
}
async function boot() {
  registerAppServiceWorker();
  wire();
  try { await api("/healthz"); } catch (e) { $("info").textContent = "cannot reach server: " + e.message + " — tap ⚙"; return; }
  await loadInfo();
  loadSkills(); // Optional catalog must not delay history or the composer.
  await loadSessions();
  await loadHistory();
  await loadSessionConfig(); // restore this session's picks from the server
  await pollConfirm(); // cold boot mid-turn (or a remote turn) has no live event; derive once
  checkInterruptedTurn();
}
boot();
</script>
