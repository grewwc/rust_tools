<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>a serve</title>
<style>
:root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --line:#30363d; --fg:#e6edf3; --dim:#8b949e; --acc:#2f81f7; --ok:#3fb950; --err:#f85149; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; display:flex; flex-direction:column; height:100dvh; }
header { display:flex; align-items:center; gap:8px; padding:10px 12px; background:var(--panel); border-bottom:1px solid var(--line); }
header b { font-size:15px; }
#info { font-size:12px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
button, select, input, textarea { font:inherit; color:var(--fg); background:#0d1117; border:1px solid var(--line); border-radius:8px; }
button { padding:7px 12px; background:#21262d; cursor:pointer; }
button:disabled { opacity:.5; cursor:default; }
button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
#views { flex:1; display:flex; min-height:0; }
#sessions { width:min(78vw,300px); border-right:1px solid var(--line); background:var(--panel); display:none; flex-direction:column; }
#sessions.open { display:flex; }
#sessions ul { list-style:none; margin:0; padding:8px; overflow-y:auto; flex:1; }
#sessions li { padding:8px; border-radius:8px; font-size:14px; }
#sessions li.cur { background:#1f6feb33; }
#sessions li small { color:var(--dim); display:block; font-size:12px; }
#sessfilter { margin:8px 8px 0; padding:6px 8px; font-size:13px; width:calc(100% - 16px); box-sizing:border-box; }
#sesscount { padding:4px 12px 0; color:var(--dim); font-size:12px; }
#chat { flex:1; display:flex; flex-direction:column; min-width:0; }
#msgs { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px; }
.msg { max-width:92%; padding:8px 12px; border-radius:12px; white-space:pre-wrap; word-break:break-word; font-size:15px; }
.msg.user { align-self:flex-end; background:#1f6feb; color:#fff; }
.msg.asst { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
.msg details { font-size:13px; color:var(--dim); }
.msg .prog { font-size:13px; color:var(--dim); }
.msg.err { border-color:var(--err); color:var(--err); }
#ovr { display:flex; gap:6px; padding:8px 12px 0; }
#ovr select { flex:1; min-width:0; font-size:13px; padding:6px 8px; }
#composer { display:flex; gap:8px; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:var(--panel); border-top:1px solid var(--line); }
#prompt { flex:1; min-height:44px; max-height:30dvh; padding:9px 10px; resize:none; }
#conn { display:none; gap:6px; padding:8px 12px; background:var(--panel); border-top:1px solid var(--line); }
#conn.open { display:flex; }
#conn input { flex:1; min-width:0; font-size:13px; padding:6px 8px; }
#connstat { display:none; padding:2px 12px 6px; font-size:12px; color:var(--dim); background:var(--panel); }
#connstat.show { display:block; }
.rowbtns { display:flex; gap:6px; padding:6px 8px; }
.rowbtns button { font-size:12px; padding:4px 8px; }
#sessbar { display:flex; align-items:baseline; gap:8px; padding:6px 12px; background:var(--panel); border-bottom:1px solid var(--line); font-size:13px; cursor:pointer; }
#sesstitle { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
#sessmeta { color:var(--dim); font-size:12px; white-space:nowrap; }
</style>
</head>
<body id="serve-app">
<header>
<button id="menu" aria-label="sessions">☰</button>
<b>a</b><span id="info">connecting…</span>
<button id="connbtn" aria-label="connection">⚙</button>
<button id="newbtn" class="primary">＋</button>
</header>
<div id="sessbar" title="sessions"><span id="sesstitle">no session</span><span id="sessmeta"></span></div>
<div id="conn">
<input id="base" placeholder="server, e.g. http://192.168.1.5:8080 (empty = this page)">
<input id="token" type="password" placeholder="bearer token (ai.serve.token)" style="flex:1">
<button id="save">save</button>
</div>
<div id="connstat"></div>
<div id="views">
<nav id="sessions"><input id="sessfilter" placeholder="filter sessions…" autocomplete="off">
<div id="sesscount"></div><ul id="sesslist"></ul>
<div class="rowbtns"><button id="fork">fork</button><button id="del">delete</button><button id="refresh">refresh</button></div>
</nav>
<main id="chat">
<div id="msgs"></div>
<div id="ovr">
<select id="omodel" aria-label="model override"></select>
<select id="oagent" aria-label="agent override"></select>
<select id="oeffort" aria-label="reasoning effort override"></select>
</div>
<div id="composer">
<button id="img" aria-label="attach image">🖼</button>
<input id="file" type="file" accept="image/*" multiple hidden>
<textarea id="prompt" placeholder="ask…" rows="1"></textarea>
<button id="send" class="primary">➤</button>
</div>
</main>
</div>
<script>
"use strict";
// Minimal mobile client for the serve HTTP API (same routes as serve-chat).
// Same-origin by default: when opened via http://<host>:<port>/app the base is
// this page's origin. Token is kept in localStorage, never in the URL.
const $ = (id) => document.getElementById(id);
const store = {
  get base() { return (localStorage.getItem("serve.base") || "").trim() || location.origin; },
  get token() { return localStorage.getItem("serve.token") || ""; },
};
let sessionId = localStorage.getItem("serve.session") || "";
// Id returned by POST /sessions that the server has not persisted yet:
// sessions materialize on the first turn, so the id is absent from
// GET /sessions until then. While set, loadSessions keeps it selected
// instead of jumping to the first stored session.
let pendingNew = null;
let lastItems = []; // latest /sessions payload, backing the session bar
let lastMsgCount = null; // message count from the last history load
let sending = false;
let pendingImages = []; // {filename, data_base64}

function headers(json) {
  const h = {};
  if (json) h["Content-Type"] = "application/json";
  if (store.token) h["Authorization"] = "Bearer " + store.token;
  return h;
}
async function api(path, opts) {
  // Attach auth on every call: individual call sites must not have to
  // remember the header (missing it once means a bare 401 with no token
  // reaching the server, which looks identical to "wrong token").
  opts = opts || {};
  opts.headers = Object.assign(headers(!!opts.body), opts.headers || {});
  const res = await fetch(store.base + path, opts);
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).error || detail; } catch (_) {}
    throw new Error(res.status + " " + detail);
  }
  return res;
}
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function sessionTitle(s) {
  return s.summary || s.first_user_prompt || ("new session · " + s.id.slice(0, 8));
}
function textOf(content) {
  if (typeof content === "string") return content;
  if (Array.isArray(content)) {
    return content.map((b) => {
      if (typeof b === "string") return b;
      if (b && typeof b === "object") return b.text || b.content || "";
      return "";
    }).join("");
  }
  if (content && typeof content === "object") return content.text || "";
  return "";
}
function addMsg(role, text, cls) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.dataset.role = role;
  d.innerHTML = esc(text) || "<span style='color:var(--dim)'>(empty)</span>";
  $("msgs").appendChild(d);
  $("msgs").scrollTop = $("msgs").scrollHeight;
  return d;
}
function addFold(title, bodyText) {
  const d = document.createElement("div");
  d.className = "msg asst";
  const det = document.createElement("details");
  const sum = document.createElement("summary");
  sum.textContent = title;
  det.appendChild(sum);
  const pre = document.createElement("div");
  pre.className = "prog";
  pre.textContent = bodyText;
  det.appendChild(pre);
  d.appendChild(det);
  $("msgs").appendChild(d);
  return { box: d, body: pre, set(title2, text2) { sum.textContent = title2; pre.textContent = text2; } };
}

// Fill a per-turn override dropdown. Entries are [value, label] pairs; the
// empty value always means "server default" and shows the current server
// label. A previous user pick survives reloads while still offered.
function fillSelect(sel, entries, currentLabel, kind) {
  const prev = sel.value;
  sel.innerHTML = "";
  const def = document.createElement("option");
  def.value = "";
  def.textContent = kind + ": server default" + (currentLabel ? " (" + currentLabel + ")" : "");
  sel.appendChild(def);
  for (const [v, label] of entries) {
    const o = document.createElement("option");
    o.value = v;
    o.textContent = label;
    sel.appendChild(o);
  }
  sel.value = (prev && [...sel.options].some((o) => o.value === prev)) ? prev : "";
}
async function loadInfo() {
  try {
    const info = await (await api("/info")).json();
    const parts = [info.model_label || info.model, info.agent, info.reasoning_effort].filter(Boolean);
    $("info").textContent = parts.join(" · ") + " (remote)";
    fillSelect($("omodel"), (info.models || []).map((m) => [m.id, m.label || m.id]), info.model_label || info.model, "model");
    fillSelect($("oagent"), (info.agents || []).map((a) => [a, a]), info.agent, "agent");
    fillSelect($("oeffort"), (info.efforts || []).map((e) => [e, e]), info.reasoning_effort, "effort");
  } catch (e) {
    let msg = "offline: " + e.message;
    if (/401/.test(e.message)) msg += " (re-save the token; serve reads ai.serve.token only at startup, so restart it after changing the token)";
    $("info").textContent = msg;
  }
}
// The drawer only highlights the current session while open, so mirror it
// into a persistent bar under the header: title plus short id, disk size,
// fork marker, and (when history was loaded) message count.
function renderSessionBar() {
  const s = lastItems.find((x) => x.id === sessionId);
  if (!s) {
    $("sesstitle").textContent = sessionId ? "session " + sessionId.slice(0, 8) + "…" : "no session — tap ＋";
    $("sessmeta").textContent = "";
    return;
  }
  $("sesstitle").textContent = (s.marked ? "★ " : "") + sessionTitle(s);
  let meta = s.id.slice(0, 8) + " · " + Math.max(1, Math.round(s.size_bytes / 1024)) + " KB";
  if (lastMsgCount != null) meta += " · " + lastMsgCount + " msgs";
  $("sessmeta").textContent = meta;
}
let sessFilter = "";
// Render the drawer from cached or fresh items: the filter narrows by title
// or id, the count line proves no session is hidden, and an optional error
// row keeps a failed refresh visible without wiping the last good list.
function renderSessionList(items, errText) {
  const q = sessFilter.trim().toLowerCase();
  const shown = q ? items.filter((s) => (sessionTitle(s) + " " + s.id).toLowerCase().includes(q)) : items;
  const ul = $("sesslist");
  ul.textContent = "";
  for (const s of shown) {
    const li = document.createElement("li");
    if (s.id === sessionId) li.className = "cur";
    li.textContent = sessionTitle(s);
    const sm = document.createElement("small");
    sm.textContent = s.id.slice(0, 8);
    li.appendChild(sm);
    li.onclick = () => { sessionId = s.id; lastMsgCount = null; localStorage.setItem("serve.session", s.id); $("sessions").classList.remove("open"); loadSessions(); loadHistory(); };
    ul.appendChild(li);
  }
  if (errText) {
    const li = document.createElement("li");
    li.textContent = errText;
    ul.appendChild(li);
  }
  $("sesscount").textContent = q ? items.length + " sessions · showing " + shown.length : items.length + " sessions";
}
async function loadSessions() {
  let items;
  try {
    items = await (await api("/sessions")).json();
  } catch (e) {
    // Keep the last good list so one failed refresh (e.g. a token hiccup)
    // cannot hide every session; the error stays as a tail row instead.
    renderSessionList(lastItems, "sessions refresh failed: " + e.message);
    return;
  }
  if (items.some((s) => s.id === sessionId)) { pendingNew = null; }
  else if (sessionId === pendingNew && sessionId) {
    // Fresh id, not yet materialized: stay on it; the first turn persists
    // it and the following loadSessions picks it up normally.
  }
  else if (!items.length) { sessionId = ""; pendingNew = null; }
  else {
    pendingNew = null;
    sessionId = items[0].id;
    localStorage.setItem("serve.session", sessionId);
    await loadHistory();
  }
  lastItems = items;
  renderSessionList(items);
  renderSessionBar();
}
async function loadHistory() {
  $("msgs").textContent = "";
  if (!sessionId) { addMsg("asst", "no session yet — tap ＋ to start one.", "asst"); return; }
  let msgs = [];
  try { msgs = await (await api("/sessions/" + sessionId + "/history?limit=200")).json(); }
  catch (e) { addMsg("err", "history failed: " + e.message, "asst err"); return; }
  lastMsgCount = msgs.length;
  renderSessionBar();
  for (const m of msgs) {
    const t = textOf(m.content).trim();
    if (!t) continue;
    if (m.role === "user") addMsg("user", t, "user");
    else if (m.role === "assistant") addMsg("assistant", t, "asst");
    else addFold(m.role, t.slice(0, 2000));
  }
  $("msgs").scrollTop = $("msgs").scrollHeight;
}

// Parse one SSE block the way serve-chat does: `event: <kind>` plus one or
// more `data: <payload>` lines. Blocks without a kind are progress lines.
function parseBlock(raw) {
  let kind = "";
  const data = [];
  for (const line of raw.split("\n")) {
    if (line.startsWith("event:")) kind = line.slice(6).trim();
    else if (line.startsWith("data:")) data.push(line.slice(5).trimStart());
    else if (line.trim() === "") continue;
    else data.push(line);
  }
  return { kind, payload: data.join("\n") };
}

async function send() {
  if (sending) return;
  const text = $("prompt").value.trim();
  if (!text && !pendingImages.length) return;
  if (!sessionId) {
    try { sessionId = (await (await api("/sessions", { method: "POST" })).json()).id; }
    catch (e) { addMsg("err", "create session failed: " + e.message, "asst err"); return; }
    localStorage.setItem("serve.session", sessionId);
  }
  let prompt = text;
  const images = pendingImages;
  pendingImages = [];
  // The file picker previews these same placeholders in the textarea, so
  // only append the ones the user has not already kept (or typed by hand).
  for (const im of images) if (!prompt.includes("[[image:" + im.filename + "]]")) prompt += (prompt && !prompt.endsWith("\n") ? "\n" : "") + "[[image:" + im.filename + "]]";
  const body = { prompt };
  if ($("omodel").value.trim()) body.model = $("omodel").value.trim();
  if ($("oagent").value.trim()) body.agent = $("oagent").value.trim();
  if ($("oeffort").value.trim()) body.reasoning_effort = $("oeffort").value.trim();
  if (images.length) body.images = images;
  $("prompt").value = "";
  if (text) addMsg("user", text, "user");
  else addMsg("user", "(images only)", "user");

  sending = true;
  $("send").disabled = true;
  // Chronological DOM order: progress and thinking folds are created before
  // (or inserted ahead of) the reply bubble, so the trace reads top-down
  // and the final answer always lands last.
  const prog = addFold("progress", "");
  const bubble = addMsg("assistant", "", "asst");
  bubble.textContent = ""; // drop addMsg's "(empty)" stand-in: deltas append below
  let progLines = [];
  let think = null;
  const fail = (msg) => {
    bubble.classList.add("err");
    bubble.textContent = msg;
    prog.box.remove();
    if (think) think.box.remove();
  };
  try {
    const res = await fetch(store.base + "/sessions/" + sessionId + "/turns/stream", {
      method: "POST", headers: headers(true), body: JSON.stringify(body),
    });
    if (!res.ok) {
      let detail = res.statusText;
      try { detail = (await res.json()).error || detail; } catch (_) {}
      throw new Error(res.status + " " + detail);
    }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    let finished = false;
    for (;;) {
      const { done, value } = await reader.read();
      if (value) buf += dec.decode(value, { stream: true });
      // Consume complete blocks; the tail may hold a partial block.
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const { kind, payload } = parseBlock(buf.slice(0, idx));
        buf = buf.slice(idx + 2);
        if (kind === "done") { finished = true; break; }
        else if (kind === "error") throw new Error(JSON.parse(payload).error || "turn failed");
        else if (kind === "delta") {
          try { bubble.textContent += JSON.parse(payload).delta || ""; }
          catch (_) { bubble.textContent += payload; }
        }
        else if (kind === "thinking_start") { think = addFold("thinking…", ""); $("msgs").insertBefore(think.box, bubble); }
        else if (kind === "thinking") {
          try { if (think) think.body.textContent += JSON.parse(payload).text || ""; } catch (_) {}
        }
        else if (kind === "thinking_done") { if (think) think.box.querySelector("summary").textContent = "thinking"; }
        else if (payload) { progLines.push(payload); prog.set("progress (" + progLines.length + ")", progLines.slice(-50).join("\n")); }
        $("msgs").scrollTop = $("msgs").scrollHeight;
      }
      if (finished) break;
      if (done) break;
    }
    if (!bubble.textContent) bubble.innerHTML = "<span style='color:var(--dim)'>(empty reply)</span>";
  } catch (e) { fail("turn failed: " + e.message); }
  sending = false;
  $("send").disabled = false;
  $("msgs").scrollTop = $("msgs").scrollHeight;
  loadInfo();
  loadSessions();
}

// Length only, never the secret: separates "nothing stored" (0 chars, save
// never landed) from "stored but wrong" without leaking the token on screen.
function showStored() {
  const el = $("connstat");
  let msg;
  try {
    msg = "stored token: " + (localStorage.getItem("serve.token") || "").length + " chars";
  } catch (e) {
    msg = "stored token: unreadable (" + (e && e.message ? e.message : e) + ")";
  }
  el.textContent = msg;
  el.classList.add("show");
}
function wire() {
  // Show what is actually stored: typing alone never reaches localStorage
  // until Save, so prefill both inputs or an empty box misleads into a 401.
  $("base").value = localStorage.getItem("serve.base") || "";
  $("token").value = localStorage.getItem("serve.token") || "";
  showStored();
  $("send").onclick = send;
  $("prompt").addEventListener("keydown", (e) => {
    // Plain Enter inserts a newline (mobile keyboards included); only the
    // send button — or Ctrl/Cmd+Enter for hardware keyboards — submits.
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); }
  });
  const toggleSessions = () => { const n = $("sessions"); n.classList.toggle("open"); if (n.classList.contains("open")) loadSessions(); };
  $("menu").onclick = toggleSessions;
  $("sessbar").onclick = toggleSessions;
  $("sessfilter").oninput = (e) => { sessFilter = e.target.value; renderSessionList(lastItems); };
  $("connbtn").onclick = () => $("conn").classList.toggle("open");
  $("save").onclick = async () => {
    const b = $("base").value.trim().replace(/\/+$/, "");
    // Phones love appending a trailing space via autocomplete; that single
    // char is enough for a 401, so trim and write it back visibly.
    const t = $("token").value.trim();
    $("token").value = t;
    try {
      localStorage.setItem("serve.base", b);
      localStorage.setItem("serve.token", t);
    } catch (e) {
      // Blocked storage (private mode, locked-down WebView) throws here;
      // without this the tap silently does nothing and every call 401s.
      const el = $("connstat");
      el.textContent = "save failed: " + (e && e.message ? e.message : e);
      el.classList.add("show");
      return;
    }
    showStored();
    $("conn").classList.remove("open");
    await boot();
  };
  $("newbtn").onclick = async () => {
    try {
      sessionId = (await (await api("/sessions", { method: "POST" })).json()).id;
      pendingNew = sessionId;
      lastMsgCount = null;
      localStorage.setItem("serve.session", sessionId);
      // The id is lazy (no history yet): show it optimistically instead of
      // loadHistory, which would 404 and print a scary red error, and let
      // loadSessions refresh only the drawer/bar around the pending id.
      $("msgs").textContent = "";
      addMsg("asst", "new session — type below to start.", "asst");
      await loadSessions();
    } catch (e) { addMsg("err", "create session failed: " + e.message, "asst err"); }
  };
  $("refresh").onclick = async () => { await loadSessions(); await loadHistory(); };
  $("fork").onclick = async () => {
    if (!sessionId) return;
    try {
      sessionId = (await (await api("/sessions/" + sessionId + "/fork", { method: "POST" })).json()).id;
      lastMsgCount = null;
      localStorage.setItem("serve.session", sessionId);
      await loadSessions(); await loadHistory();
    } catch (e) { addMsg("err", "fork failed: " + e.message, "asst err"); }
  };
  $("del").onclick = async () => {
    if (!sessionId || !confirm("delete this session?")) return;
    try {
      await api("/sessions/" + sessionId, { method: "DELETE" });
      sessionId = "";
      lastMsgCount = null;
      localStorage.removeItem("serve.session");
      await loadSessions(); await loadHistory();
    } catch (e) { addMsg("err", "delete failed: " + e.message, "asst err"); }
  };
  $("img").onclick = () => $("file").click();
  $("file").onchange = async () => {
    for (const f of $("file").files) {
      if (pendingImages.length >= 10) break;
      const dataUrl = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
      const b64 = String(dataUrl).split(",", 2)[1] || "";
      if (!b64) continue;
      const filename = (f.name || "image").replace(/[^\w.\-]+/g, "_");
      pendingImages.push({ filename, data_base64: b64 });
    }
    $("file").value = "";
    if (pendingImages.length && !$("prompt").value.includes("[[image:")) {
      $("prompt").value += ($("prompt").value && !$("prompt").value.endsWith("\n") ? "\n" : "") +
        pendingImages.map((im) => "[[image:" + im.filename + "]]").join("\n");
    }
  };
}
async function boot() {
  wire();
  try { await api("/healthz"); } catch (e) { $("info").textContent = "cannot reach server: " + e.message + " — tap ⚙"; return; }
  await loadInfo();
  await loadSessions();
  await loadHistory();
}
boot();
</script>
</body>
</html>
