plugins {
    id "com.android.application"
}

def configuredServeUrl = providers.gradleProperty("serveUrl")
        .getOrElse("https://10.37.110.250:8080")
def escapedServeUrl = configuredServeUrl
        .replace("\\", "\\\\")
        .replace("\"", "\\\"")

android {
    namespace "com.grewwc.aserve"
    compileSdk 33

    defaultConfig {
        applicationId "com.grewwc.aserve"
        minSdk 26
        targetSdk 33
        versionCode 30
        versionName "1.16.9"
        buildConfigField "String", "DEFAULT_SERVER_URL", "\"${escapedServeUrl}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packagingOptions {
        jniLibs {
            // Keep every ABI while compressing native libraries in the APK so the
            // universal install artifact remains below repository hosting limits.
            useLegacyPackaging true
        }
    }

}

dependencies {
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.20.0"
    implementation "com.google.mlkit:text-recognition-chinese:16.0.1"
    testImplementation "junit:junit:4.13.2"
}