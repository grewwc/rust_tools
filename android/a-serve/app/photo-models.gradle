import java.security.MessageDigest
import groovy.json.JsonOutput
import org.gradle.api.tasks.PathSensitivity
import org.gradle.api.tasks.bundling.Zip

def modelVersion = "1"
def generatedModels = layout.buildDirectory.dir("generated/photo-models")
def packageOutput = layout.buildDirectory.dir("distributions/photo-models")
def archiveName = "a-serve-photo-models-v${modelVersion}.zip"
def manifestName = "a-serve-photo-models-v${modelVersion}.json"
def archivePath = "/a-serve-photo-models.zip"
def modelCache = new File(gradle.gradleUserHomeDir, "caches/a-serve-photo-models/v1")
def generatedModelDir = generatedModels.get().asFile
def textRevision = "58edf8cada9e398793dca955574a48cbb7f18be2"
def visionRevision = "6b7c523703ae26e39be4b03774966f8571c7f523"
def modelFiles = [
        [name: "clip_text.onnx", source: "sentence-transformers/clip-ViT-B-32-multilingual-v1/resolve/${textRevision}/onnx/model_qint8_arm64.onnx", sha256: "3bed77e83926519660b5c0833cb3321cfde952331edec4f7d501c7d384b8a8a7", maxBytes: 160L * 1024 * 1024],
        [name: "clip_vision.onnx", source: "Xenova/clip-vit-base-patch32/resolve/${visionRevision}/onnx/vision_model_quantized.onnx", sha256: "583fd1110a514667812fee7d684952aaf82a99b959760c8d7dca7e0ab9839299", maxBytes: 110L * 1024 * 1024],
        [name: "clip_dense.safetensors", source: "sentence-transformers/clip-ViT-B-32-multilingual-v1/resolve/${textRevision}/2_Dense/model.safetensors", sha256: "d12568dc7300970a4d3dbb49068ad16cd89b99840b74b026f8e48071e9414f74", maxBytes: 5L * 1024 * 1024],
        [name: "clip_vocab.txt", source: "sentence-transformers/clip-ViT-B-32-multilingual-v1/resolve/${textRevision}/vocab.txt", sha256: "fe0fda7c425b48c516fc8f160d594c8022a0808447475c1a7c6d6479763f310c", maxBytes: 5L * 1024 * 1024]
]

def sha256 = { File file ->
    MessageDigest digest = MessageDigest.getInstance("SHA-256")
    file.withInputStream { input ->
        byte[] buffer = new byte[1024 * 1024]
        for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
            if (read > 0) digest.update(buffer, 0, read)
        }
    }
    digest.digest().collect { String.format("%02x", it & 0xff) }.join()
}

def downloadPinned = { Map spec, File destination ->
    if (destination.isFile() && sha256(destination) == spec.sha256) return
    destination.parentFile.mkdirs()
    File partial = new File(destination.parentFile, destination.name + ".partial")
    partial.delete()
    List<String> bases = ["https://huggingface.co", "https://hf-mirror.com"]
    Exception failure = null
    for (String base : bases) {
        try {
            def connection = new URL("${base}/${spec.source}").openConnection()
            connection.connectTimeout = 15_000
            connection.readTimeout = 30_000
            connection.useCaches = false
            if (connection.contentLengthLong > spec.maxBytes) {
                throw new GradleException("Oversized photo model ${spec.name}")
            }
            connection.inputStream.withCloseable { input ->
                partial.withOutputStream { output ->
                    byte[] buffer = new byte[1024 * 1024]
                    long total = 0
                    for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
                        if (read == 0) continue
                        total += read
                        if (total > spec.maxBytes) {
                            throw new GradleException("Oversized photo model ${spec.name}")
                        }
                        output.write(buffer, 0, read)
                    }
                }
            }
            if (sha256(partial) != spec.sha256) {
                throw new GradleException("SHA-256 mismatch for ${spec.name}")
            }
            if (!partial.renameTo(destination)) {
                destination.bytes = partial.bytes
                partial.delete()
            }
            return
        } catch (Exception error) {
            failure = error
            partial.delete()
        }
    }
    throw new GradleException("Cannot download pinned photo model ${spec.name}", failure)
}

tasks.register("preparePhotoModels") {
    outputs.files(modelFiles.collect { new File(generatedModelDir, it.name) })
    doLast {
        generatedModelDir.mkdirs()
        modelFiles.each { spec ->
            File cached = new File(modelCache, spec.name)
            downloadPinned(spec, cached)
            File output = new File(generatedModelDir, spec.name)
            if (!output.isFile() || sha256(output) != spec.sha256) {
                java.nio.file.Files.copy(cached.toPath(), output.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        }
    }
}

def photoModelsArchive = tasks.register("photoModelsArchive", Zip) {
    dependsOn tasks.named("preparePhotoModels")
    from(generatedModels) {
        include(modelFiles.collect { it.name })
    }
    destinationDirectory.set(packageOutput)
    archiveFileName.set(archiveName)
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    includeEmptyDirs = false
}

tasks.register("packagePhotoModels") {
    dependsOn photoModelsArchive
    def archiveFile = photoModelsArchive.flatMap { it.archiveFile }
    def manifestFile = packageOutput.map { it.file(manifestName) }
    inputs.file(archiveFile).withPathSensitivity(PathSensitivity.NONE)
    inputs.property("modelVersion", modelVersion)
    inputs.property("archivePath", archivePath)
    outputs.file(manifestFile)
    doLast {
        File archive = archiveFile.get().asFile
        def files = modelFiles.collect { spec ->
            File model = new File(generatedModelDir, spec.name)
            String actualSha256 = sha256(model)
            if (actualSha256 != spec.sha256) {
                throw new GradleException("SHA-256 mismatch for prepared photo model ${spec.name}")
            }
            [name: spec.name, sha256: actualSha256, size: model.length()]
        }
        def manifest = [
                version: modelVersion,
                archive: [
                        path  : archivePath,
                        sha256: sha256(archive),
                        size  : archive.length()
                ],
                files  : files
        ]
        File output = manifestFile.get().asFile
        output.parentFile.mkdirs()
        output.setText(JsonOutput.prettyPrint(JsonOutput.toJson(manifest)) + "\n", "UTF-8")
    }
}